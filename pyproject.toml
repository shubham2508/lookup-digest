[project]
name = "lookup-digest"
version = "0.1.0"
description = "Daily Digest: a one-page 6:00am PT triage digest for Avery Chen (myRico work trial)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "pyyaml>=6",
  "typer>=0.12",
  "openai>=1.40",
  "httpx>=0.27",
  "icalendar>=5.0",
  "python-dateutil>=2.9",
  "python-dotenv>=1.0",
  "rapidfuzz>=3.9",
  "tzdata>=2024.1",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
digest = "cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["digest", "generator", "eval", "cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4", "BLE", "PYI"]
ignore = ["B008", "E501"]  # B008: typer.Option in defaults is the typer idiom; E501: long Field descriptions are fine
