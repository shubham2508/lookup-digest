judgment_rules:
- '- I read email between 6:15-6:45am, then 12:30-1pm, then once after Wren is asleep.'
- '- Anything that arrives outside those windows can wait.'
- '- I batch reply. I almost never reply in real time.'
- '- I block 9-11am Tue/Thu for deep work. Anyone scheduling over that block without asking is doing something wrong,
  and I want to know.'
- '- Quiet investor threads. If Marcus or another VC went quiet, I want to know after three business days, not three
  weeks.'
- '- Customer health signals buried in support threads. If Halberd''s procurement lead is suddenly quieter, that''s
  a flag.'
- '- Calendar collisions involving Wren''s daycare, doctor appointments, or anything Sam put on our shared calendar.
  Family first. Always.'
- '- Promises I made in email and didn''t put on a todo list. "I''ll send that by Friday" hiding in a Tuesday thread.'
- '- Hiring loops that have stalled. We''re hiring two engineers and a designer; if a candidate is mid-loop and
  nobody has moved them in 5+ days, that''s on me.'
digest_prefs:
- 'A great digest answers three questions in under 90 seconds of reading:'
- 1. **What needs me today?** Not what's interesting. Not what's new. What requires *my* judgment, *my* signature,
  *my* reply, before end of day.
- 2. **What am I about to drop?** Threads that have gone quiet on my end. Calendar conflicts I haven't resolved.
  Decisions I deferred and forgot.
- 3. **What can I dispatch right now?** Replies under 3 sentences. Quick yes/no approvals. Calendar accepts/declines.
  Drafts you can write *for* me and I just send.
- A bad digest tells me about my own calendar like I haven't seen it, summarizes threads I just sent, or pretends
  a marketing newsletter is news.
- '- Newsletters. Even the good ones. Even Stratechery. I''ll read them when I want to.'
- '- Calendar invites I already accepted. I don''t need a reminder that I have a meeting at 2pm; my calendar app
  does that.'
- '- Marketing emails from SaaS tools, even ones we pay for.'
- '- Long threads where I''ve already had the last word and nobody else has replied.'
- '- Anything where the only "action" is "FYI."'
- '- If the inbox data is older than 24 hours, say so.'
- '- If you can''t tell whether a thread is urgent, say "I''m not sure" and show me the thread.'
- '- If you drafted a reply based on assumptions, flag the assumptions.'
- '- If two sources disagree (e.g., calendar says I''m meeting Marcus Friday but email says we moved to Monday),
  tell me — don''t pick one and hide it.'
- Pacific time. My day starts at 6am. The digest runs at 6:00am sharp. "Today" in the digest means today's calendar
  plus anything that needs a reply before midnight Pacific.
tone:
- '- Short. Lowercase greetings or none at all. Sign off with "Avery" or nothing.'
- '- No "I hope this email finds you well." No "circling back." No "just wanted to."'
- '- Direct but not cold. Warmth comes from specificity, not adjectives. "Thanks for the rev share on Halberd, that''s
  the thing I wanted" beats "Thanks so much!!"'
- '- For investors during the raise, slightly more polished. Still short.'
- '- For Sam: don''t draft. Surface and let me write.'
