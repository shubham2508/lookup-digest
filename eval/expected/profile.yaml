judgment_rules:
  - "Override based on content."
  - "If Marcus or another VC went quiet, I want to know after three business days, not three weeks."
  - "If Halberd's procurement lead is suddenly quieter, that's a flag."
  - "Calendar collisions involving Wren's daycare, doctor appointments, or anything Sam put on our shared calendar. Family first. Always."
  - "Promises I made in email and didn't put on a todo list."
  - "if a candidate is mid-loop and nobody has moved them in 5+ days, that's on me."
  - "Anyone scheduling over that block without asking is doing something wrong, and I want to know."

digest_prefs:
  - "A great digest answers three questions in under 90 seconds of reading"
  - "Newsletters. Even the good ones. Even Stratechery."
  - "Calendar invites I already accepted."
  - "Marketing emails from SaaS tools, even ones we pay for."
  - "Long threads where I've already had the last word and nobody else has replied."
  - "Anything where the only \"action\" is \"FYI.\""
  - "If you can't tell whether a thread is urgent, say \"I'm not sure\" and show me the thread."
  - "If two sources disagree"

tone:
  - "Short. Lowercase greetings or none at all. Sign off with \"Avery\" or nothing."
  - "No \"I hope this email finds you well.\" No \"circling back.\" No \"just wanted to.\""
  - "Direct but not cold. Warmth comes from specificity, not adjectives."
  - "For investors during the raise, slightly more polished. Still short."
  - "For Sam: don't draft. Surface and let me write."
  - "If you drafted a reply based on assumptions, flag the assumptions."

hard_rules:
  never_draft_for: [Sam Park]
  no_newsletter_items: true
  recruiter_pattern_only: true
  cite_everything: true             # inferred: architecture §8 rule 5; profile.md asks for honesty, not citations
  flag_stale_email_hours: 24
