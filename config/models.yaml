# Roles -> model IDs. Loaded by digest/config.py; every LLM call goes through digest/llm.py.
#
# Family rule (Shubham, 2026-09-28; OPEN_QUESTIONS.md #1):
#   pipeline roles  -> one cheap OpenAI model (GPT-6 Luna), reasoning effort dialled per stage
#   generator       -> NOT an API model. The Data track's Claude Code session (Fable 5.1) writes
#                      the prose files; generator/ code assembles, labels, validates. Zero API spend.
#   judge           -> a THIRD family (not OpenAI, not Anthropic). Mid-tier is enough: it applies one
#                      fixed rubric with the evidence attached. PENDING Shubham's pick; leave null until then.
#   sim_avery       -> cheapest; mostly code, the model is only a fallback.
# digest/config.py enforces: judge.family not in {pipeline family, generator family}.

provider:
  base_url: https://openrouter.ai/api/v1
  api_key_env: OPENROUTER_API_KEY
  app_name: lookup-digest

roles:
  compose:      {model: openai/gpt-6-luna, family: openai, reasoning_effort: high, max_tokens: 32000}
  materializer: {model: openai/gpt-6-luna, family: openai, reasoning_effort: low}
  compiler:     {model: openai/gpt-6-luna, family: openai, reasoning_effort: low}
  # v2 (specs/PIVOT_SPEC.md): readers and sweeps judge raw text; cached per (input, as_of date).
  thread_reader:      {model: openai/gpt-6-luna, family: openai, reasoning_effort: medium, max_tokens: 16000}
  calendar_sweep:     {model: openai/gpt-6-luna, family: openai, reasoning_effort: medium, max_tokens: 16000}
  notes_tasks_sweep:  {model: openai/gpt-6-luna, family: openai, reasoning_effort: medium, max_tokens: 16000}
  news_sweep:         {model: openai/gpt-6-luna, family: openai, reasoning_effort: medium, max_tokens: 16000}
  contact_classifier: {model: openai/gpt-6-luna, family: openai, reasoning_effort: low}
  signature_parser:   {model: openai/gpt-6-luna, family: openai, reasoning_effort: low}
  linker:       {model: openai/gpt-6-luna, family: openai, reasoning_effort: low}   # 'same thing?' decisions in compute (replaces word similarity)
  # Jev (TypeSafe's classifier model, OpenRouter /api/alpha/decisions) answers the linker's pick-one questions first;
  # the linker role above is the fallback. Remove this line to run the linker on the LLM only.
  decider:      {model: typesafe/jev-1.13, family: typesafe}
  generator:    {model: claude-code-session, family: anthropic, reasoning_effort: null}
  # Shubham, 2026-09-29: DeepSeek V4.1 Flash (third family; $0.30 / $1.20 per 1M, structured output). The Fable
  # calibration round below was skipped at submission; the judge's scores are reported, never gated.
  judge:        {model: deepseek/deepseek-v4.1-flash, family: deepseek, reasoning_effort: null}
  # One-time calibration reference (Shubham, 2026-09-28): the first judging round runs on Fable so the cheap judge
  # can be compared against it. Never the judge of record (same family as the generator); the validator only
  # checks `judge`, so this role may be Anthropic.
  judge_reference: {model: anthropic/claude-fable-5.1, family: anthropic, reasoning_effort: medium}
  sim_avery:    {model: openai/gpt-5-nano, family: openai, reasoning_effort: low}
