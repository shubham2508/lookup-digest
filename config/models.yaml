# Roles -> model IDs. Loaded by digest/config.py; every LLM call goes through digest/llm.py.
#
# Family rule (Shubham, 2026-09-28; OPEN_QUESTIONS.md #1):
#   pipeline roles  -> one cheap OpenAI model (GPT-6 Luna), reasoning effort dialled per stage
#   generator       -> NOT an API model. The Data track's Claude Code session (Fable 5.1) writes
#                      the prose files; generator/ code assembles, labels, validates. Zero API spend.
#   judge           -> a THIRD family (not OpenAI, not Anthropic). Mid-tier is enough: it applies one
#                      fixed rubric with the evidence attached. PENDING Shubham's pick; leave null until then.
#   sim_avery       -> cheapest; mostly code, the model is only a fallback.
# digest/config.py enforces: judge.family not in {pipeline family, generator family}.

provider:
  base_url: https://openrouter.ai/api/v1
  api_key_env: OPENROUTER_API_KEY
  app_name: lookup-digest

roles:
  extractor:    {model: openai/gpt-6-luna, family: openai, reasoning_effort: low}
  triage:       {model: openai/gpt-6-luna, family: openai, reasoning_effort: medium}
  compose:      {model: openai/gpt-6-luna, family: openai, reasoning_effort: high}
  materializer: {model: openai/gpt-6-luna, family: openai, reasoning_effort: low}
  compiler:     {model: openai/gpt-6-luna, family: openai, reasoning_effort: low}
  generator:    {model: claude-code-session, family: anthropic, reasoning_effort: null}
  judge:        {model: null, family: null, reasoning_effort: medium}   # PENDING: google/gemini-3.8-flash or x-ai/grok-4.7
  sim_avery:    {model: openai/gpt-5-nano, family: openai, reasoning_effort: low}
