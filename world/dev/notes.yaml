last_modified_header: "every rendered note and tasks.md starts with '<!-- last-modified: <ISO datetime PT> -->' (OPEN_QUESTIONS #6c) so staleness survives git clone; the file mtime is set to the same instant"

tasks:
  file: tasks.md
  mtime_day: 18                 # 12 days before day 30 (data_generation §7); stale on every run day (>7 days)
  mtime_time: "18:20"
  format: "- [ ] <title> (due: YYYY-MM-DD)"
  items:
    - {id: "task:1", title: "Send Diane the September board update", due_day: 21, status: open, labels: {about: board-update:monthly, storyline: S10}, note: "overdue; duplicated in avery-todos.md with 9/18"}
    - {id: "task:2", title: "Finalize Q2 planning doc for the Thu review", due_day: 30, status: open, labels: {about: report:q2-planning, storyline: BG-q2}, note: "the one due today"}
    - {id: "task:3", title: "Close out August expenses in Ramp", due_day: 24, status: open, labels: {about: approval:expenses-september, storyline: BG-expenses}, note: "expense approvals; merges with the three Ramp emails"}
    - {id: "task:4", title: "Send Halberd the SOC 2 Type II report", due_day: 17, status: open, labels: {about: report:soc2-halberd, storyline: BG-soc2}, note: "already done per email (S5.b14: Jordan sent it day 14) → stale task / contradiction"}
    - {id: "task:5", title: "Review D&O renewal quote from Harbor", due_day: 56, status: open, labels: {about: other:dno-renewal, storyline: BG-harbor}, note: "far out; must not surface"}
  absent: [deal:series-a:cap-table, pricing:deck-v2-feedback]     # S1 promise and S16 promise are in no task or todo
