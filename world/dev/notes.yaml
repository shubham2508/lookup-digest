# world/dev/notes.yaml — the 10 notes and tasks.md (specs/data_generation.md §7). Each note's first line is
# "Date: YYYY-MM-DD | Attendees: …" (dates resolve from `day` via the anchor). File mtimes are set to the note's
# day at `time`. The M2 prose files under prose/notes/ carry the full text; this file fixes what each must plant.

notes:
  - file: board-meeting-minutes.md
    kind: meeting_notes
    day: 2
    time: "16:30"
    attendees: [avery, priya, diane, ravi]
    title: "Board meeting - Aug 27"
    plants:
      - "Diane: monthly investor updates during the raise. Agreed. Last update went out Aug 14."
      - "ARR $3.2M as of end of July (consistent with the profile at the time)"
      - "Series A: IPV first meeting scheduled; Aperture inbound"
      - "Hiring: two backend reqs + designer open"
    must_include: ["monthly investor updates during the raise", "Aug 14"]
    labels: {storyline: S10, about: [board-update:monthly], agreements: [{rule: "monthly investor updates during the raise", cadence: monthly}], claims: [{subject: last_board_update_sent, value: "Aug 14"}, {subject: ARR, value: "$3.2M"}]}
  - file: board-update-draft.md
    kind: draft
    day: 19
    time: "21:40"
    attendees: []
    title: "September investor update - DRAFT"
    plants:
      - "half-written; metrics block says 'ARR: $3.2M' (stale); 'Pipeline: TODO'; 'Hiring: TODO'; 'Ask: intros to Series A leads'"
    must_include: ["$3.2M", "TODO"]
    labels: {storyline: S10, about: [board-update:monthly], note_kind: draft, draft_of: "board update", claims: [{subject: ARR, value: "$3.2M"}]}
  - file: finance-sync.md
    kind: meeting_notes
    day: 22
    time: "15:45"
    attendees: [avery, kim, priya]
    title: "Finance sync - Sep 16"
    plants:
      - "ARR $3.4M as of Sep 15 (Northstar line 2 expansion + Brightline)"
      - "Inference spend running over model - Priya to write it up (→ S13)"
      - "Cash: 19 months at current burn; Stripe payouts on autopilot (→ background Stripe failure later)"
      - "Q3 estimated taxes paid (Pinnacle)"
    must_include: ["ARR $3.4M"]
    labels: {storyline: S10, about: [board-update:monthly, other:inference-cost-overrun], claims: [{subject: ARR, value: "$3.4M"}], action_items: [{owner: other, about: other:inference-cost-overrun, status_in_thread: open}]}
  - file: q2-planning.md
    kind: draft
    day: 27
    time: "17:00"
    attendees: []
    title: "Q2 (FY27, Nov-Jan) planning doc - owner Avery"
    plants:
      - "two open comments: Jordan (day 28, on-call rotation headcount) and Priya (day 29, backfill concurrency cap) - rendered as inline comment blocks with dates"
      - "analytics vendor line: 'Lumen eval — decision hinges on ingestion + backfill behaviour; Metrika renews 9/25'"
      - "review at the Thu Sep 24 14:30 planning sync"
    must_include: ["ingestion + backfill", "open comment"]
    labels: {storyline: BG-q2, about: [report:q2-planning, meeting:lumen-demo, renewal:metrika], note_kind: draft, draft_of: "Q2 planning doc", open_comments: [{by: jordan, status: open}, {by: priya, status: open}]}
    mtime_note: "file mtime = day 29 08:45 (Priya's comment), so on day 30 the note is fresh"
  - file: sprint-week.md
    kind: status
    day: 28
    time: "09:30"
    attendees: [jordan, sofia, dev, omar, lena, yuki]
    title: "Standup notes - week of Sep 21"
    plants:
      - "Halberd rollout on track for Oct 6 (cutover checklist sent)"
      - "Two non-blocking regressions opened by QA (Lena): export CSV encoding; dashboard date filter - neither blocks Oct 6"
      - "Veritas line 2 ingest: Sofia, target Wed"
    must_include: ["on track for Oct 6", "non-blocking"]
    labels: {storyline: S5, about: [rollout:halberd:oct-6, rollout:veritas:line-2], note_kind: status, claims: [{subject: halberd_rollout_status, value: "on track for Oct 6"}]}
  - file: gtm-weekly.md
    kind: meeting_notes
    day: 27
    time: "16:30"
    attendees: [avery, tomas, kim, ana]
    title: "GTM weekly - Sep 21"
    plants:
