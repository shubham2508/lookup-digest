  - {ref: S12.b2, day: 20, time: "16:20", source: email, thread: t-lumen-demo, from: priya, to: [dana], cc: [avery], event: "next week or the week after; Avery should be there", hardness: [terse]}
  - {ref: S12.c1, day: 28, time: "17:31", source: calendar, event: lumen-demo-20260924, from: dana, event: "invite created for Thu day 30 10:30–11:15 over Avery's deep-work block; Priya accepts"}
  - {ref: S12.b3, day: 28, time: "17:31", source: email, thread: t-lumen-demo, from: dana, to: [avery], cc: [priya],
     event: "booked Thursday 10:30 (invite sent); asks Avery to choose: standard product demo or API-focused walkthrough of ingestion and backfill; 'quick one'",
     must_include: ["10:30", "standard demo", "API-focused"], hardness: [salesy]}
  - {ref: S12.n1, day: 27, time: "17:00", source: note, note: q2-planning.md,
     event: "Q2 planning doc (Avery owns): analytics vendor line says 'Lumen eval — decision hinges on ingestion + backfill behaviour; Metrika renews 9/25'; plus the two open comments (S-bg Q2)",
     must_include: ["ingestion + backfill"]}

