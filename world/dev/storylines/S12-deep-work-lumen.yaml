id: S12
name: deep-work-lumen
reviewed: true
tier_truth: P2
summary: >
  Avery blocks Tue/Thu 09:00–11:00 as "Deep work" (recurring, organizer Avery). Avery also organizes the weekly
  Thursday 09:00–09:30 1:1 with Jordan, which sits inside the block by Avery's own choice. On Tuesday day 28 at
  17:31 Dana Whitfield (Lumen Analytics, the analytics vendor under evaluation) sends an invite for a demo on
  Thursday day 30 10:30–11:15 (organizer Lumen, Avery NEEDS-ACTION) and an email asking Avery to choose between a
  standard demo and an API-focused walkthrough. q2-planning.md says the evaluation hinges on ingestion + backfill
  behaviour. Tests: organizer-aware deep-work flag (Lumen yes, Jordan no); `calendar_response` as a proposal plus
  a `decide` on the agenda with a recommendation; the Metrika auto-renewal (background mini-arc) is the context.

threads:
  - {id: t-lumen-demo, subject: "Lumen demo Thursday 10:30 - agenda?", category: vendors_misc}
events:
  - {uid: deep-work-tue-thu, calendar: work, title: "Deep work", rrule: "FREQ=WEEKLY;BYDAY=TU,TH", start: "09:00", end: "11:00", organizer: avery, from_day: -21}
  - {uid: jordan-1on1-thu, calendar: work, title: "1:1 Jordan / Avery", rrule: "FREQ=WEEKLY;BYDAY=TH", start: "09:00", end: "09:30", organizer: avery,
     attendees: [{id: jordan, partstat: ACCEPTED}], from_day: -49}
  - {uid: lumen-demo-20260924, calendar: work, title: "Lumen Analytics <> Tessera - demo", day: 30, start: "10:30", end: "11:15", organizer: dana,
     attendees: [{id: avery, partstat: NEEDS-ACTION}, {id: priya, partstat: ACCEPTED}, {id: dana, partstat: ACCEPTED}], created_day: 28, created_time: "17:31"}

beats:
