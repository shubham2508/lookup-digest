id: S9
name: hiring-paused-stall-keystone
reviewed: true
tier_truth: P1
summary: >
  Three hiring signals that look alike and are not. (a) The product designer req is paused at the Thursday day 23
  hiring sync ("until the raise closes"); Keystone Search, the retained firm engaged on day 4, keeps sending
  designer profiles on days 24, 28 and 29 because nobody told them → not a stall, not a recruiter; dispatch is a
  one-line `forward_delegate` to Tomás ("req's paused, can you hold them?"). (b) Backend candidate Theo Lindgren
  finished his onsite on day 23; nobody scheduled the debrief; 5 days unmoved at the day-28 run, 7 by day 30 →
  `hiring_stall`. (c) The profile says "two engineers and a designer"; the data says the designer req is paused →
  profile drift. Tests: paused → no stall flag; Keystone ≠ cold recruiter (retained, warm history, no
  recruiter-pattern line); real stall flagged; `profile_update` for the open reqs.

threads:
  - {id: t-keystone-kickoff,   subject: "Keystone x Tessera - designer search kickoff", category: hiring}
  - {id: t-keystone-batch,     subject: "Product Designer - new profiles for review",   category: hiring}
  - {id: t-theo-loop,          subject: "Theo Lindgren - onsite Thursday",              category: hiring}

beats:
  - {ref: S9.b1, day: 4,  time: "10:00", source: email, thread: t-keystone-kickoff, from: tomas, to: [bram], cc: [avery], event: "kicks off the retained designer search; scope, comp band, 'Avery will join the final round'", must_include: ["retained"]}
  - {ref: S9.b2, day: 4,  time: "14:30", source: email, thread: t-keystone-kickoff, from: bram,  to: [tomas], cc: [avery], event: "engagement letter countersigned; first profiles in two weeks", must_include: ["engagement"]}
  - {ref: S9.b3, day: 14, time: "09:05", source: email, thread: t-theo-loop,        from: jordan, to: [avery], cc: [tomas], event: "Theo passed the screen; onsite Thursday the 17th; panel Jordan, Priya, Sofia; Avery does the 30-minute closer"}
  - {ref: S9.b4, day: 21, time: "08:50", source: email, thread: t-theo-loop,        from: jordan, to: [avery], cc: [tomas], event: "confirms Thursday schedule; Avery slot 16:00"}
  - {ref: S9.b5, day: 23, time: "18:10", source: email, thread: t-theo-loop,        from: jordan, to: [avery], cc: [tomas], event: "onsite done; scores in Greenhouse; 'will get the debrief on the calendar' — never does", must_include: ["debrief"]}
  - {ref: S9.n1, day: 23, time: "11:00", source: note, note: hiring-sync.md,
     event: "hiring sync: designer req PAUSED until the raise closes (Avery's call; Tomás to tell Keystone); Theo onsite today, debrief TBD (Jordan); Mei offer approved at L4; Ines Ferreira screen next week",
     must_include: ["paused until the raise closes", "debrief TBD"]}
  - {ref: S9.b6, day: 24, time: "15:20", source: email, thread: t-keystone-batch,   from: bram,  to: [avery], cc: [tomas], event: "three designer profiles with one-liners and links; asks who should screen them", must_include: ["three profiles"]}
  - {ref: S9.b7, day: 28, time: "10:10", source: email, thread: t-keystone-batch,   from: bram,  to: [avery], cc: [tomas], event: "two more profiles; 'per our engagement' asks for feedback on the first three", must_include: ["per our engagement"]}
  - {ref: S9.b8, day: 29, time: "15:00", source: email, thread: t-keystone-batch,   from: bram,  to: [avery], cc: [tomas], event: "one standout profile (Luca Moretti); asks for a 15-minute call to calibrate", must_include: ["calibrate"]}

