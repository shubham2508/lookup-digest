id: S11
name: family
reviewed: true
tier_truth: P0
summary: >
  Three personal-domain items from three kinds of sender. (1) Sam emails Monday day 27 at 21:15: Wren's daycare
  re-enrollment form needs both signatures by Friday, plus a mixed Thanksgiving question; Avery replies Tuesday
  07:10 (done) so the item is present on day 28 only and gone after (resolved disappears). (2) Little Acorns
  Daycare emails Wednesday day 29 at 17:45: closed Thursday Sep 24 for an HVAC failure → collides with a full work
  day (non-family sender, personal domain, high). (3) Sam adds "Wren - pediatrician 3:00pm" to shared_family.ics at
  21:04 on day 29 for Thursday 15:00–16:00, overlapping the 14:30–15:30 Q2 planning sync. Tests: anything from Sam
  is P0 with no draft (P0 case 10); the pediatrician overlap surfaces with `message_person` (P0 case 11); the
  daycare closure collides with meetings; a sibling's photo email is family but FYI (must not).

threads:
  - {id: t-sam-daycare-form, subject: "daycare form + thanksgiving",       category: personal}
  - {id: t-daycare-closure,  subject: "IMPORTANT: Little Acorns closed Thursday 9/24", category: personal}
  - {id: t-kai-photos,       subject: "pics from sunday",                   category: personal}
events:
  - {uid: wren-pediatrician-20260924, calendar: shared_family, title: "Wren - pediatrician 3:00pm", day: 30, start: "15:00", end: "16:00",
     organizer: sam, attendees: [{id: sam, partstat: ACCEPTED}, {id: avery, partstat: NEEDS-ACTION}], created_day: 29, created_time: "21:04",
     location: "Oakland Pediatrics, Grand Ave"}
  - {uid: q2-planning-sync-20260924, calendar: work, title: "Q2 planning sync", day: 30, start: "14:30", end: "15:30", organizer: avery,
     attendees: [{id: avery, partstat: ORGANIZER}, {id: priya, partstat: ACCEPTED}, {id: jordan, partstat: ACCEPTED}, {id: tomas, partstat: ACCEPTED}], created_day: 22}

beats:
  - {ref: S11.b1, day: 27, time: "21:15", source: email, thread: t-sam-daycare-form, from: sam, to: [avery],
     event: "re-enrollment form for Little Acorns needs both signatures by Friday (it's on the counter); also: thanksgiving at Kai's or home?; lowercase, two topics",
     must_include: ["both signatures", "by friday"], hardness: [mixed_topics, lowercase]}
  - {ref: S11.b2, day: 28, time: "07:10", source: email, thread: t-sam-daycare-form, from: avery, to: [sam],
     event: "signed both pages this morning, it's back on the counter; thanksgiving: home, will tell Kai", must_include: ["signed"]}
  - {ref: S11.b3, day: 26, time: "09:40", source: email, thread: t-kai-photos, from: kai, to: [avery, sam],
     event: "photos from Sunday at the lake; 'no need to reply'", must_include: ["no need to reply"]}
  - {ref: S11.b4, day: 29, time: "17:45", source: email, thread: t-daycare-closure, from: beatriz, to: [parents_list], cc: [],
     event: "Little Acorns closed Thursday Sep 24: HVAC failure, repair crew tomorrow; reopening Friday; apologies; no pickup/dropoff",
     must_include: ["closed Thursday", "September 24"], hardness: [bulk_style_but_human]}
  - {ref: S11.c1, day: 29, time: "21:04", source: calendar, event: wren-pediatrician-20260924, from: sam,
     event: "Sam creates 'Wren - pediatrician 3:00pm' for Thu 15:00–16:00; Avery invited, no response"}

