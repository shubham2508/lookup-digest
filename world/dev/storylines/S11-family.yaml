    category: personal
    storyline: S11
    expected:
      type: human_thread
      domain: personal
      intent_primary: ask
      about: [family:daycare-form]
      ball_awaiting: nobody          # after Avery's reply
      closed_by_courtesy: false
      sender_relationship: {category: family, subtype: partner}
      asks: [{to_avery: true, kind: signature, deadline_day: 31, status: answered}, {to_avery: true, kind: decision, deadline_day: null, status: answered}]
      suspicious: false
    messages:
      - {beat_ref: S11.b1, day: 27, time: "21:15", from: sam,   to: [avery], must_include: ["both signatures", "by friday"]}
      - {beat_ref: S11.b2, day: 28, time: "07:10", from: avery, to: [sam],   must_include: ["signed"], is_from_avery: true}
  - thread: t-kai-photos
    category: personal
    storyline: S11
    must_not_surface: true
    must_not_reason: family_fyi_no_action
    classification_case: family_must_not
    expected: {type: human_thread, domain: personal, intent_primary: social, about: [family:photos], ball_awaiting: nobody, closed_by_courtesy: false,
               sender_relationship: {category: family, subtype: relative}}
  - thread: t-daycare-closure
    category: personal
    storyline: S11
    classification_case: daycare_closure_collision
    expected:
      type: human_thread
      domain: personal
      intent_primary: fyi
      about: [family:daycare-closure]
      ball_awaiting: avery           # Avery has to arrange care; no reply owed to the daycare
      closed_by_courtesy: false
      sender_relationship: {category: vendor, subtype: daycare}
      claims: [{subject: daycare_closure, value: "Thursday Sep 24"}]
      suspicious: false
    messages:
      - {beat_ref: S11.b4, day: 29, time: "17:45", from: beatriz, to: [parents_list], must_include: ["closed Thursday", "September 24"]}
  - event: wren-pediatrician-20260924
    storyline: S11
    expected: {type: task, note: "code-parsed calendar event; cited as event:wren-pediatrician-20260924"}

