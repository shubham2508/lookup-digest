    noise: [t-veritas-usage, t-veritas-soc2, t-veritas-handover, t-veritas-line2]
  - run_day: 30
    candidates: [{type: profile_drift, about: other:veritas-procurement-lead}, {type: contradiction, about: renewal:veritas}]
    items:
      - {about: other:veritas-procurement-lead, priority: P3, section: pulse, actions: [profile_update], cites_any: [t-veritas-handover]}
      - {about: renewal:veritas, priority: P1, section: pulse, actions_any: [question, decide, watch, task], cites_any: ["note:gtm-weekly.md"],
         notes: "on day 30 the S14 ingest incident on the same account is a separate P0 item; compose may cross-link them but both about keys must be present"}
    noise: [t-veritas-usage, t-veritas-soc2, t-veritas-handover, t-veritas-line2]

