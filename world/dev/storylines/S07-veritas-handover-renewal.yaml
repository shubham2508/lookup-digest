  - run_day: 27
    candidates: [{type: profile_drift, about: other:veritas-procurement-lead}]
    items: [{about: other:veritas-procurement-lead, priority: P3, section: pulse, actions: [profile_update], cites_any: [t-veritas-handover]}]
    absent: [renewal:veritas]
    noise: [t-veritas-usage, t-veritas-soc2]
  - run_day: 28
    candidates:
      - {type: profile_drift, about: other:veritas-procurement-lead}
