    candidates: [{type: profile_drift, about: other:veritas-procurement-lead, facts_hint: {field: "procurement lead at Veritas", data_value: "Nadia Rahimi (since day 15)"}}]
    items: [{about: other:veritas-procurement-lead, priority: P3, section: pulse, actions: [profile_update], cites_any: [t-veritas-handover],
             notes: "footer line 'Suggested profile updates'; renders every run day until the profile is edited"}]
    absent: [renewal:veritas]
    notes: "the first push (day 8) was handled; nothing open on the renewal until the note lands"
