     event: "pricing deck v2 attached (tier naming, packaging); asks for feedback by Friday so Ana can use it Monday", must_include: ["feedback by Friday"], hardness: [long]}
  - {ref: S16.b2, day: 22, time: "18:05", source: email, thread: t-pricing-deck-v2, from: avery, to: [tomas], cc: [ana],
     event: "will get you feedback by Friday", must_include: ["will get you feedback by Friday"]}
  - {ref: S16.b3, day: 24, time: "14:20", source: email, thread: t-pricing-deck-notes, from: avery, to: [tomas], cc: [ana],
     event: "new thread: 'here are my notes on the pricing deck' — six bullet points on v2; 'as promised'", must_include: ["notes on the pricing deck", "as promised"]}
  - {ref: S16.b4, day: 24, time: "16:50", source: email, thread: t-pricing-deck-notes, from: tomas, to: [avery], cc: [ana],
     event: "thanks, folding them in — courtesy", must_include: ["thanks"]}

