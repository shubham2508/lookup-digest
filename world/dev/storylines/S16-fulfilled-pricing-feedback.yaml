id: S16
name: fulfilled-pricing-feedback
reviewed: true
tier_truth: none
summary: >
  Wednesday day 22 Tomás sends the pricing deck v2 and asks for feedback by Friday; Avery replies in that thread
  "will get you feedback by Friday". On Friday day 24 at 14:20 Avery sends the feedback in a NEW thread ("pricing
  deck notes") with a different subject. The promise is fulfilled across threads and must not surface on any run
  day; there is no todo for it anywhere. Tests: cross-thread fulfillment via `fulfills_hint` + about key +
  recipient + time order (extraction_schema §6.3). Distinct from S15's Plant Bundle sign-off.

threads:
