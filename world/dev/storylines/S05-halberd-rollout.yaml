id: S5
name: halberd-rollout
reviewed: true
tier_truth: P1
summary: >
  Halberd Manufacturing is the healthiest reference customer: a steady weekly cadence all month (rollout planning,
  an SSO thread closed by Jordan, training logistics). On Wednesday day 29 at 14:08 Renee Tan asks whether the
  Oct 6 rollout is still on; her steering committee meets Friday morning and she needs an answer by end of
  Thursday. sprint-week.md (day 28 standup) says the rollout is on track with two non-blocking regressions. A
  Factory Floor Weekly item (day 29 06:30) reports Halberd and Northstar presented case studies at the MX Summit
  without naming Tessera. Tests: same-day `reply` grounded in the note; the news item attaches to the reply; the
  closed SSO thread must not surface; the cadence must NOT be flagged as a drop.

threads:
  - {id: t-halberd-rollout-plan, subject: "Oct 6 rollout - plan and owners",          category: customers}
  - {id: t-halberd-sso,          subject: "SSO / Okta setup for the pilot group",     category: customers}
  - {id: t-halberd-training,     subject: "Operator training sessions - dates",        category: customers}
  - {id: t-halberd-rollout,      subject: "Oct 6 - still on?",                        category: customers}
newsletters:
  - {id: nl-factoryfloor-37, publication: "Factory Floor Weekly", day: 29, time: "06:30", category: newsletters,
     items: [{headline_hint: "MX Manufacturing AI Summit case studies (Halberd, Northstar)", attaches_to: [rollout:halberd:oct-6]},
             {headline_hint: "Robotics retrofit funding roundup", attaches_to: []},
             {headline_hint: "Tariff guidance for tier-2 suppliers", attaches_to: []}]}

beats:
  # baseline cadence (Renee inbound days 2, 5, 8, 12, 14, 16, 19, 22, 24, 27, 29 → steady ~2.5-day gaps, no drop)
  - {ref: S5.b1,  day: 2,  time: "09:40", source: email, thread: t-halberd-rollout-plan, from: renee, to: [avery], cc: [tomas, yuki],
     event: "proposes Oct 6 as the go-live for the Fresno plant; asks who owns what", must_include: ["Oct 6"]}
  - {ref: S5.b2,  day: 2,  time: "13:15", source: email, thread: t-halberd-rollout-plan, from: avery, to: [renee], cc: [tomas, yuki],
     event: "confirms Oct 6; Yuki owns the plan; Avery joins the weekly call", must_include: ["Oct 6"]}
  - {ref: S5.b3,  day: 5,  time: "10:05", source: email, thread: t-halberd-rollout-plan, from: renee, to: [yuki], cc: [avery],
     event: "sends the plant contact list; asks about the data-mapping workshop date"}
  - {ref: S5.b4,  day: 5,  time: "15:30", source: email, thread: t-halberd-rollout-plan, from: yuki, to: [renee], cc: [avery],
     event: "workshop Sep 4; mapping template attached"}
  - {ref: S5.b5,  day: 8,  time: "08:50", source: email, thread: t-halberd-rollout-plan, from: renee, to: [yuki], cc: [avery],
     event: "workshop went well; two mapping questions; thanks Yuki"}
  - {ref: S5.b6,  day: 12, time: "11:20", source: email, thread: t-halberd-sso, from: joel, to: [mateo], cc: [renee, avery],
     event: "SSO: Okta SAML assertion failing for the pilot group; error text", hardness: [technical_jargon]}
  - {ref: S5.b7,  day: 12, time: "16:45", source: email, thread: t-halberd-sso, from: jordan, to: [joel], cc: [renee, avery],
     event: "root cause: attribute mapping; fix shipped; asks Joel to retest"}
  - {ref: S5.b8,  day: 14, time: "09:10", source: email, thread: t-halberd-sso, from: renee, to: [jordan], cc: [joel, avery],
     event: "retest passed; thanks — courtesy close", must_include: ["Thanks"]}
  - {ref: S5.b9,  day: 14, time: "09:30", source: email, thread: t-halberd-sso, from: priya, to: [jordan], cc: [renee, joel, avery],
     event: "+1, nice catch — FYI-only cc reply on a closed thread (must-not: Priya FYI cc)", must_include: ["+1"]}
  - {ref: S5.b10, day: 16, time: "14:00", source: email, thread: t-halberd-training, from: renee, to: [yuki], cc: [avery],
     event: "asks for operator training dates in the week of Sep 28"}
  - {ref: S5.b11, day: 16, time: "17:20", source: email, thread: t-halberd-training, from: yuki, to: [renee], cc: [avery],
     event: "offers Sep 29 and Oct 1"}
  - {ref: S5.b12, day: 19, time: "10:15", source: email, thread: t-halberd-training, from: renee, to: [yuki], cc: [avery],
     event: "takes Sep 29; asks for a one-page operator guide"}
  - {ref: S5.b13, day: 22, time: "09:05", source: email, thread: t-halberd-rollout-plan, from: renee, to: [avery], cc: [yuki, tomas],
     event: "weekly check-in: pilot group live; asks whether the SOC 2 report was sent (it was, day 14 per Jordan) — mixed topics", hardness: [mixed_topics]}
  - {ref: S5.b14, day: 22, time: "12:40", source: email, thread: t-halberd-rollout-plan, from: avery, to: [renee], cc: [yuki, tomas],
     event: "yes, Jordan sent SOC 2 on the 8th; pilot looks good", must_include: ["SOC 2"]}
  - {ref: S5.b15, day: 24, time: "11:30", source: email, thread: t-halberd-training, from: renee, to: [yuki], cc: [avery],
     event: "confirms 14 operators for Sep 29; thanks"}
  - {ref: S5.b16, day: 27, time: "10:50", source: email, thread: t-halberd-rollout-plan, from: renee, to: [yuki], cc: [avery],
     event: "asks about the cutover checklist; Yuki replies day 27 15:00 (beat S5.b17)"}
  - {ref: S5.b17, day: 27, time: "15:00", source: email, thread: t-halberd-rollout-plan, from: yuki, to: [renee], cc: [avery],
     event: "checklist attached; Avery has nothing to do"}
  # the trap
  - {ref: S5.b18, day: 29, time: "14:08", source: email, thread: t-halberd-rollout, from: renee, to: [avery], cc: [],
     event: "asks whether Oct 6 is still on; her steering committee meets Friday morning; needs an answer by end of Thursday; mentions hearing about 'a couple of regressions' from Joel",
     must_include: ["still on", "by end of Thursday"], hardness: [indirect_phrasing]}
  - {ref: S5.b19, day: 29, time: "06:30", source: newsletter, newsletter: nl-factoryfloor-37, from: factoryfloor,
     event: "Factory Floor Weekly #37: MX Summit case studies from Halberd and Northstar (neither names its vendor); two other items",
     must_include: ["MX Manufacturing AI Summit", "Halberd", "Northstar"]}
  - {ref: S5.n1, day: 28, time: "09:30", source: note, note: sprint-week.md,
     event: "standup notes: Halberd rollout on track for Oct 6; two non-blocking regressions (QA, Lena); owners", must_include: ["on track for Oct 6", "non-blocking"]}

