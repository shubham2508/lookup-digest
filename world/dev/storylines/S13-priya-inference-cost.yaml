     event: "august inference bill $41k vs $22k modelled; halberd backfill + northstar line 2 doubled token volume; two options: cap backfill concurrency at 2 (halberd slips ~1 week) or eat it through the raise; 'putting this in email so it's in writing'; wants a decision this week",
     must_include: ["$41k", "$22k", "in writing", "cap backfill concurrency"], hardness: [lowercase, terse]}
  - {ref: S13.b2, day: 29, time: "07:05", source: newsletter, newsletter: nl-modelwatch-58, from: modelwatch,
     event: "Model Watch #58: OpenRouter announces volume pricing on DeepSeek-V4 Pro ~30% lower effective Oct 1; two unrelated items",
     must_include: ["DeepSeek-V4 Pro", "30%", "October 1"]}

