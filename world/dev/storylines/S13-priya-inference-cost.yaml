id: S13
name: priya-inference-cost
reviewed: false
tier_truth: P0
summary: >
  Priya (co-founder, CTO) never emails Avery; on Tuesday day 28 at 15:10 she does, on purpose: the August
  inference bill came in at $41k against $22k modelled, driven by the Halberd backfill and Northstar line 2, and
  she wants the decision in writing: cap backfill concurrency (slows Halberd) or eat it through the raise. Avery
  does not reply. On Wednesday day 29 at 07:05 the Model Watch newsletter reports a ~30% price cut on the model
  family Tessera uses, effective Oct 1. Tests: the profile's "if she emails instead of slacks, it's intentional"
  rule → P0 (P0 case 9); `decide` with options and a recommendation, not a fake dispatchable reply; the news item
  attaches to the open item on day 30; Priya's FYI "+1" cc in the Halberd SSO thread (S5) must not surface.

threads:
  - {id: t-priya-inference, subject: "inference spend - need a call from you", category: internal_routine}
newsletters:
  - {id: nl-modelwatch-58, publication: "Model Watch", day: 29, time: "07:05", category: newsletters,
     items: [{headline_hint: "OpenRouter volume pricing on DeepSeek-V4 Pro, ~30% lower, effective Oct 1", attaches_to: [other:inference-cost-overrun]},
             {headline_hint: "New open-weights 70B release benchmark table", attaches_to: []},
             {headline_hint: "Agent eval harness roundup", attaches_to: []}]}

beats:
