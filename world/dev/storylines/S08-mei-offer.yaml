id: S8
name: mei-offer
reviewed: true
tier_truth: P1
summary: >
  Mei Tanaka, backend engineer candidate: onsite day 12, debrief day 20 (Jordan recommends L4 offer), offer
  approved at hiring sync day 23, DocuSign "awaiting your signature" lands Tuesday day 28 at 08:40 (≈45.5 h
  pending at the day-30 run). Tuesday 18:22 Tomás emails that Jordan and he signed Monday and that Mei's competing
  offer expires Friday. Tests: `approve` with a deadline from an automated action-bearing email plus a human
  thread; DocuSign (action) vs GitHub (FYI) classification; the candidate's own courtesy note must not surface.

threads:
  - {id: t-mei-loop,      subject: "Mei Tanaka - backend loop",                 category: hiring}
  - {id: t-mei-offer,     subject: "Mei - offer letter in DocuSign, deadline",   category: hiring}
  - {id: t-mei-thanks,    subject: "Thank you - Tessera onsite",                  category: hiring}
automated:
  - {id: auto-docusign-mei, system: DocuSign, day: 28, time: "08:40", category: notifications, subject: "Please DocuSign: Offer Letter - Mei Tanaka.pdf"}

beats:
  - {ref: S8.b1, day: 12, time: "17:30", source: email, thread: t-mei-loop,   from: jordan, to: [avery], cc: [tomas], event: "onsite done today; panel feedback positive; debrief next week"}
  - {ref: S8.b2, day: 13, time: "09:10", source: email, thread: t-mei-thanks, from: mei,    to: [jordan], cc: [avery], event: "thank-you note after the onsite; no ask", must_include: ["Thank you"]}
  - {ref: S8.b3, day: 20, time: "12:15", source: email, thread: t-mei-loop,   from: jordan, to: [avery], cc: [tomas], event: "debrief done: strong hire; recommends L4 offer at the top of band; asks Avery to approve at Thursday's hiring sync", must_include: ["L4"]}
  - {ref: S8.b4, day: 20, time: "13:40", source: email, thread: t-mei-loop,   from: avery,  to: [jordan], cc: [tomas], event: "approved in principle; finalise at hiring sync", must_include: ["hiring sync"]}
  - {ref: S8.b5, day: 27, time: "10:30", source: email, thread: t-mei-loop,   from: tomas,  to: [avery], cc: [jordan], event: "offer sent to Mei this morning; DocuSign will route to Avery last", hardness: [long, mixed_topics]}
  - {ref: S8.b6, day: 28, time: "08:40", source: automated, automated: auto-docusign-mei, from: docusign, to: [avery],
     event: "DocuSign: Offer Letter - Mei Tanaka awaiting your signature; Jordan Liu and Tomás Reyes have signed", must_include: ["awaiting your signature", "Mei Tanaka"]}
  - {ref: S8.b7, day: 28, time: "18:22", source: email, thread: t-mei-offer,  from: tomas,  to: [avery], cc: [jordan],
     event: "Jordan and Tomás both signed Monday; the letter is sitting in Avery's DocuSign; Mei said this afternoon her other offer expires Friday", must_include: ["expires Friday", "DocuSign"], hardness: [long, mixed_topics]}

