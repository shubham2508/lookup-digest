  - thread: t-meridian-eval
    category: customers
    storyline: S15
    must_not_surface: true
    must_not_reason: handled_by_tomas
    expected: {type: human_thread, domain: work, intent_primary: ask, about: [pricing:plant-bundle], ball_awaiting: other, closed_by_courtesy: false,
               sender_relationship: {category: customer, subtype: prospect, stage: prospect}, asks: [{to_avery: false, kind: information, deadline_day: 35, status: open}],
               stage_signals: [{entity: meridian, stage: prospect, day: 10}]}
  - event: pipeline-review-20260915
    storyline: S15
    expected: {type: task, note: "code-parsed; avery_partstat DECLINED; day 21; declined_meeting candidate joins by about key / participants"}
  - note: gtm-weekly.md
