id: S15
name: declined-pipeline-review
reviewed: true
tier_truth: P1
summary: >
  Tomás organized a pipeline review for Tuesday day 21 (Sep 15) 10:00–11:00, over Avery's deep-work block; Avery
  DECLINED. At that meeting the team agreed a "Plant Bundle" price of $48k/yr for new mid-market deals (list is
  $60k) so Tomás can quote Meridian Foods by Friday day 31. gtm-weekly.md (Monday day 27) records "Avery sign-off
  pending". Tomás emails Monday day 28 at 13:05 asking for sign-off by Friday. Tests: declined-meeting fallout
  (the decision made where Avery wasn't needs Avery); `decide` with a recommendation; the DECLINED event over the
  block is not a deep-work violation; Tomás's routine weekly pipeline emails (background) must not surface.

threads:
  - {id: t-plant-bundle-signoff, subject: "Plant Bundle pricing - need your sign-off by Fri", category: internal_routine}
  - {id: t-meridian-eval,        subject: "Meridian Foods - evaluation next steps",            category: customers}
events:
  - {uid: pipeline-review-20260915, calendar: work, title: "Pipeline review (Q4 push)", day: 21, start: "10:00", end: "11:00", organizer: tomas,
     attendees: [{id: avery, partstat: DECLINED}, {id: tomas, partstat: ACCEPTED}, {id: ana, partstat: ACCEPTED}, {id: yuki, partstat: ACCEPTED}, {id: kim, partstat: ACCEPTED}], created_day: 17}

beats:
  - {ref: S15.c1, day: 17, time: "15:00", source: calendar, event: pipeline-review-20260915, from: tomas, event: "invite for Tue day 21 10:00 (over the block); Avery declines on day 18 with 'deep work, send me the notes'"}
  - {ref: S15.b1, day: 10, time: "11:30", source: email, thread: t-meridian-eval, from: carla, to: [tomas], cc: [avery], event: "Meridian: wants pricing for two plants after the pilot; decision by end of September"}
  - {ref: S15.b2, day: 10, time: "16:00", source: email, thread: t-meridian-eval, from: tomas, to: [carla], cc: [avery], event: "will come back with a proposal", hardness: [long]}
  - {ref: S15.n1, day: 27, time: "16:30", source: note, note: gtm-weekly.md,
     event: "GTM weekly: 'Pricing: 9/15 pipeline review agreed the Plant Bundle at $48k/yr for new mid-market (list $60k). Avery sign-off pending. Tomás wants to quote Meridian by Fri 9/25.'",
     must_include: ["Plant Bundle", "$48k", "sign-off pending"]}
  - {ref: S15.b3, day: 28, time: "13:05", source: email, thread: t-plant-bundle-signoff, from: tomas, to: [avery], cc: [kim, ana],
     event: "recap of the pipeline review Avery couldn't make; the $48k Plant Bundle for new mid-market deals; asks for sign-off by Friday so Meridian gets the quote; 'separate from your deck notes, which I folded in, thanks' (S16 link); three other topics",
     must_include: ["sign-off", "by Friday", "$48k"], hardness: [long, mixed_topics, buried_ask]}

