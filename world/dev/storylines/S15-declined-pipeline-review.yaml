      domain: work
      intent_primary: ask
      about: [pricing:plant-bundle]
      ball_awaiting: avery
      closed_by_courtesy: false
      sender_relationship: {category: team, subtype: exec}
      asks: [{to_avery: true, kind: approval, deadline_day: 31, status: open}]
      claims: [{subject: plant_bundle_price, value: "$48k"}]
      suspicious: false
    messages:
