     organizer: marcus, attendees: [{id: avery, partstat: ACCEPTED}, {id: marcus, partstat: ACCEPTED}, {id: ravi, partstat: ACCEPTED}],
     created_day: 22, created_time: "14:10", last_modified_day: 22, note: "stale: never moved to Monday (calendar.yaml)"}

