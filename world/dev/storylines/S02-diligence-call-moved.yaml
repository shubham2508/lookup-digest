  - {ref: S2.b2, day: 28, time: "11:15", source: email, thread: t-ipv-call-move, from: marcus, to: [avery], cc: [elena, ravi],
     event: "Friday's slot collided with an LP meeting; proposes Monday Sep 28 at 10:00 instead; introduces Elena (partner, runs technical diligence) who will join",
