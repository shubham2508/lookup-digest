summary: >
  work.ics holds "Tessera x IPV - diligence call" on Friday day 31 (Sep 25) 10:00, organizer Marcus, Avery accepted,
  created day 22. On Tuesday day 28 Marcus emails that Friday no longer works, proposes Monday Sep 28 10:00, and
  loops in Elena Vasquez, a second IPV partner who runs technical diligence. Avery confirms Monday by email the same
  evening. Nobody updates the invite. On Wednesday day 29 at 06:05, five minutes after the run, Elena emails a
  prep request for Monday. Tests: calendar-vs-email contradiction shown with BOTH dates even though Avery had the
  last word in the thread; Elena inherits P0; the 06:05 email is absent on day 29 and present on day 30 (P0 case 14).

