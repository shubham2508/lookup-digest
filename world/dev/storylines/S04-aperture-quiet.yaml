     event: "enjoyed the conversation at the founders dinner; Aperture is building a supply-chain thesis; asks for the deck",
     must_include: ["deck"], hardness: []}
  - {ref: S4.b2, day: 7, time: "08:05", source: email, thread: t-aperture, from: avery, to: [david],
     event: "sends the deck (link), two sentences",
     must_include: ["deck"], hardness: []}
  - {ref: S4.b3, day: 9, time: "11:15", source: email, thread: t-aperture, from: david, to: [avery],
     event: "two questions: gross margin trajectory with the inference line, and how much of ARR is the three reference accounts; happy to dig in when Avery is ready",
     must_include: ["gross margin"], hardness: [indirect_phrasing]}
  - {ref: S4.b4, day: 9, time: "15:40", source: email, thread: t-aperture, from: avery, to: [david],
     event: "great questions; let's talk soon; will send some times",
     must_include: ["let's talk soon", "send some times"], hardness: []}

