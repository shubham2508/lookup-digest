id: S4
name: aperture-quiet
reviewed: false
tier_truth: P0
summary: >
  David Kim (Partner, Aperture Capital; not in the profile) came in through a founder-dinner conversation. Days 6–9:
  intro, deck, two sharp questions on gross margin, and Avery's "let's talk soon, I'll send some times" on Thursday
  day 9 (Sep 3). Nothing since. Avery owns the next step. Capital thread with Avery's own open commitment ≥ 3
  business days old → quiet_thread on every run day (11 business days on day 26, 14 on day 30). Tests: quiet
  investor during an active raise; the tool must classify Aperture as capital from the signature/domain, and the
  draft is dispatchable (propose times).

threads:
  - {id: t-aperture, subject: "Tessera - following up from the Dogpatch dinner", category: investors_board}

beats:
