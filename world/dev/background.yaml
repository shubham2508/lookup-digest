    assertions:
      - {id: BG-hollis-present,  kind: item_present,        run_day: 30, args: {about: meeting:hollis-catchup, actions_any: [reply]}}
      - {id: BG-hollis-category, kind: contact_category_is, run_day: 30, args: {email: hollis.grant@gmail.com, category: network}}
      - {id: BG-hollis-history-noise, kind: item_absent,    run_day: 30, args: {source_id: t-hollis-3}, description: "the earlier threads (Avery replied) never surface"}
