      - {id: BG-press-category, kind: contact_category_is, run_day: 30, args: {email: sasha.kimura@manufacturingsignal.com, category: external_visibility}}
      - {id: BG-press-not-p0,   kind: priority_not,        run_day: 30, args: {about: other:press-request, priority: P0}}
