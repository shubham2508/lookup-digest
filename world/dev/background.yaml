    labels: {type: human_thread, domain: work, intent_primary: promotional, ball_awaiting: nobody, sender_relationship: {category: cold_inbound, subtype: sales_pitch}}
    assertions:
      - {id: BG-dataforge-absent, kind: item_absent, run_day: 30, args: {source_id: t-dataforge-pitch}}
