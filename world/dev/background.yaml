    expectations:
      - {run_day: 28, items: [{about: other:franchise-tax-notice, priority: P2, section: decisions, actions_any: [forward_delegate, task], cites_any: [t-franchise-tax], notes: "forward to Kim / Rina (CPA) with the deadline"}]}
      - {run_day: 30, items: [{about: other:franchise-tax-notice, priority_band: [P2, P3], section: decisions, actions_any: [forward_delegate, task], cites_any: [t-franchise-tax]}]}
    assertions:
      - {id: BG-tax-present,  kind: item_present,        run_day: 28, args: {about: other:franchise-tax-notice}}
      - {id: BG-tax-category, kind: contact_category_is, run_day: 30, args: {email: notices@statewideagents.com, category: legal_gov}}
  - id: colleague_wedding_invite
    case: "a colleague's wedding invite (personal domain, not urgent)"
    thread: {id: t-sofia-wedding, subject: "save the date - Nov 14!", category: personal, about: [other:sofia-wedding], must_not_surface: true, must_not_reason: personal_social_far_deadline}
