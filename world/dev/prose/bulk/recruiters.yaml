    time: "08:12"
    from: {name: "Brett Callahan", email: "brett.callahan@pinnacletalentpartners.com"}
    to: [avery]
    subject: "Exciting opportunity: VP of Engineering, Series C fintech (SF/hybrid)"
    bulk: false
    signature: |-
      Brett Callahan
      Managing Director | Pinnacle Talent Partners
      Executive Search for High-Growth Technology Companies
      M: (415) 555-0134 | brett.callahan@pinnacletalentpartners.com
