    body: |
      Hi Avery,

      I hope this note finds you well! I came across your profile and was impressed by your engineering leadership at Tessera Health.

      I'm partnering with a Series C fintech in San Francisco (post-money $900M, 220 employees) on a VP of Engineering search. They're looking for someone who has scaled a platform team from 20 to 100+ and is comfortable in a regulated environment. Your background is a strong fit.

      Comp is competitive (base $320-380K plus meaningful equity) and the role reports directly to the CTO.

      Would you be open to a 15-minute call this week or next to hear more? Even if the timing isn't right, I'd love to stay connected for future opportunities.

      Best,
      Brett
