      · Pelagic 2.5 adds a "max reasoning tokens" cap. Set it or your P99 cost will surprise you.
      · A university group released a 300-document benchmark for supplier-contract clause extraction. Small, clean, useful. https://latentdispatch.ai/p/clause-bench
      · Tanager announces a 70B Coder for October.

