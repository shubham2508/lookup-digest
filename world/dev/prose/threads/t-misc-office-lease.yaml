      Hi Avery,

      A courtesy note as we head into the last two quarters of your term. Your lease for Suite 310 at 2201 Harrison St runs through March 31, 2027. The renewal option in Section 3.2 requires written notice no earlier than December 1 and no later than December 31, 2026 if you want to exercise it at the pre-set rate; otherwise we would go to market rate in the new year.

      There is nothing to decide now. I'm sending this in September because a few tenants asked for more lead time last cycle. If you'd like to see numbers for a 24- or 36-month extension, or you're thinking about more space, let me know and I'll put something together in November.

      One practical note: the elevator modernization I mentioned in June is scheduled for the week of October 12; expect one car out of service that week.

      Best,
