      Avery - a few things from GTM land, none of them urgent enough for a Slack ping but all of them worth two minutes!

      Ridgeway first. Dale wants a plant visit rather than another Zoom, which I take as a very good sign from a man who told me in August that he "doesn't do software". Yuki and I are looking at the week of October 12 for the drive out. The pilot scope we sketched at GTM weekly (one line, six weeks, success criterion = alert acknowledgement under 15 minutes) is holding up, and Dale hasn't asked about price yet, which I'm choosing to read as trust rather than indifference. More when we have a date.

      Now the recap I owe you from the pipeline review on the 15th, since you were heads-down that morning and asked for the notes. Kim, Ana, Yuki and I went through Q4 deal by deal, and the thing that fell out is that we have five mid-market prospects stuck at the same place: they love the pilot, they choke on the list price ($60k/yr for a single plant). So we put together what Kim has been calling the Plant Bundle: $48k/yr for new mid-market deals, two plants included, additional plants at $18k each, twelve-month term, list stays $60k for enterprise. Kim modeled the margin and it holds even at three plants (she'll send the sheet if you want it). This is separate from your deck notes, which I folded in, thanks - the deck is about how we present tiers, this is about what we charge. What I need from you is a sign-off on the $48k number by Friday, because Carla at Meridian has to take a recommendation to her leadership by the end of the month and Ana wants the quote out Friday with the bundle on it rather than list. If you'd rather counter or hold, say so and we'll quote list and eat the risk.

      Third: Ana closed the Alder Packaging pilot this morning! First deal she has run end to end. Kim, dinner is on the GTM budget; Ana picks the place.

      Fourth and last: I cleaned up the pipeline stages in the CRM, so "Pilot" now means a signed pilot agreement and "Proposal" means a quote has gone out. The dashboard you look at on Mondays will show fewer deals in Proposal; that's the cleanup, not a collapse.

      That's it! Sorry for the length, you know how I am.

      Tomás

      P.S. The Q4 kickoff dinner is looking like the first week of October. Sam and the little one are welcome if you'd rather not do a late one.
