      Tomás, Avery -

      Thank you both. The engagement letter is countersigned and attached (Keystone_Tessera_Engagement_2026-08.pdf); the signature invoice will follow from our office on Monday.

      Confirming the brief as I have it:

      - Product Designer, first design hire, 5+ years, B2B / industrial software, comfortable as a team of one.
      - $165k-$185k base plus equity; Avery joins the final round for every finalist.
      - First batch of profiles in two weeks, i.e. the week of September 14, then a steady cadence after that.

      On the comp band: it is workable for the profile you describe, though the strongest candidates at the industrial end of the market are clustering around $190k. I will flag anyone above band rather than screen them out.

      Per our engagement, I'll send profiles as a batch with a one-line summary and a portfolio link each, and I'd ask for feedback on each batch within a week so I can adjust the search.

      Kind regards,
