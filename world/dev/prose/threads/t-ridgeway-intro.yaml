      Mr. Reyes,

      Ana Kowalski from your office gave me your name. We run two rolling lines at the Stockton mill and I have been told your system can tell me why line B runs slower on the night shift. I would like a short call to scope a trial on one line before anyone talks to me about the whole plant.

      Tuesday or Wednesday afternoon next week suits. I have copied your CEO, as Ana suggested I should.

      Dale Whitcombe
