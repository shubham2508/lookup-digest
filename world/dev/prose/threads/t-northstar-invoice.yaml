      Grace, Paul - thank you for laying it out, that's much clearer than what I had!

      Kim has withdrawn CM-0834 and issued CM-0834-R2 for $0.00 referencing TS-0834-R1, so the file closes on your side with nothing unapplied. It went out at 5:30 today from billing@tessera.io - Paul, shout if it hasn't shown up by tomorrow morning.

      And yes to the call: Kim and I can do Friday at 10:30 or 2:00, 20 minutes. I'll send an invite for 10:30 and we can move it. If the R2 does the trick and there's nothing left to talk about, happy to cancel and give everyone 20 minutes back!

      Separately - Marta mentioned to Yuki again that line 2 had a couple of downtime events last week that the report didn't catch. Not urgent, just want to make sure we hear about it properly; I'll ask Yuki to follow up with her.

      Tomás
