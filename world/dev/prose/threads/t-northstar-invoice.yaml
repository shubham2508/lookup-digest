    cc: [avery, paul]
    reply_to: m1
    quotes_previous: true
    forward_of: null
    signature: default
    body: |
      Grace!! Apologies, totally our miss - the add-on got keyed as a fresh annual instead of co-termed to your Nov 30 anniversary. Kim is reissuing TS-0834 at the PO amount ($7,125, pro-rated to Nov 30) and you'll have the corrected PDF tomorrow morning: same invoice number with an -R1 suffix so Paul's system doesn't see it as a second invoice, plus a credit memo for the original so your side has a clean void. Paul, if you'd rather handle it differently just say the word and Kim will do whatever your system likes best.

      While I have you: line 2 data is looking great on our side. Yuki says the first week of batches came in clean, which honestly almost never happens on a second line. Would love to get Marta on a call at some point to hear what the operators think of the exception report now that it's split daily/weekly.

      Also - no pressure at all - we're putting together the agenda for a Sept QBR and I'll send some dates separately next week. Would be great to have Henrik's team in the room this time if that's possible on your end, even for the first 20 minutes.

      Thanks for flagging so fast, and sorry again for the admin!

      Tomás
