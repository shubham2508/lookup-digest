    body: |
      Hi Tomás,

      Paul in AP kicked back your invoice TS-0834. The line 2 add-on is billed at the full annual rate ($19,000) but our PO 4500218877 was cut for the pro-rated amount to our contract anniversary ($7,125), which is what we agreed with Ana in July. AP can't pay against a mismatched PO - the system is very literal about it - so could you have someone reissue at the PO amount? Paul is cc'd and can send the PO copy if that helps.

      Sorry for the admin.

      Grace
  - id: m2
    beat_ref: S6.b8
