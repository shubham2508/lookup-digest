    body: |
      Tomás,

      Paul's notes from this morning, pasting so it's all in one place:

      - TS-0834 (original, $19,000): rejected 9/3, never posted
      - TS-0834-R1 ($7,125): posted 9/4, scheduled for the 9/17 payment run
      - CM-0834 ($19,000 credit): received 9/4 with the R1, no invoice to apply it to, currently unapplied
      - Ask: withdraw CM-0834, or reissue it against the R1 for $0 so the file closes

      Can we do a 20-minute call with Kim this week? Paul's on the thread and will bring the screenshots. I'd like this off my list before the QBR.

      Grace
