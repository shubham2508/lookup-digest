      Tomás - sorry for the Sunday email, I'm catching up.

      Paul flagged a second mismatch on Friday: the -R1 posted fine, but the credit memo that came with it (CM-0834) is for the full $19,000 and we never posted the original invoice, so on our side it's sitting as an unapplied credit and the system now thinks Tessera owes us money. He emailed you directly on Saturday with the detail, I think. Can Kim take a look Monday? Paul's threshold for "escalate to Procurement" is low, in the nicest possible way.

      Grace
