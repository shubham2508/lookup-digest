      Avery, Tomás -

      First batch: three profiles for the Product Designer search, each with a one-line summary and a portfolio link. All three have been screened by me this week and know about Tessera at a high level.

      1. Hanna Eklund - 7 yrs, currently lead designer at a fleet-telematics company; shipped a technician-facing tablet app used on shop floors; team of two. https://hannaeklund.design/work
      2. Rafael Ortega - 6 yrs, sole designer at a Series A industrial IoT startup; strong on research, lighter on visual polish. https://ortega-portfolio.co/industrial
      3. Claire Baptiste - 9 yrs, most recently at a large ERP vendor, wants to go earlier stage; the most senior of the three and above band at $195k. https://clairebaptiste.studio/selected

      Who should screen them first on your side - Tomás and Jordan for the portfolio review, or would you prefer to look yourself before they go further? Let me know and I will schedule accordingly.

      Kind regards,
