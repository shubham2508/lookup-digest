      Dear Cobalt Ridge founders,

      Please join us for our fall portfolio founders dinner.

      When: Thursday, October 8, 6:30 pm
      Where: The Barrel Room, 415 Sansome St, San Francisco
      Who: founders and CEOs across Funds II and III, plus the Cobalt Ridge partners

      This year's format is small tables by stage, so you'll be seated with founders raising or closing a Series A. Diane and Tom will each host a table.

      RSVP by October 2 using the link below; plus-ones are welcome with a heads-up, and dietary needs can go in the form.

      cobaltridge.vc/founders-dinner-2026

      We hope to see you there.
