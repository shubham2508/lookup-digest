      Dear Tessera team,

      We are rolling Tessera out to a second group of users at our Reno facility and have a question regarding single sign-on.

      Our identity provider (Microsoft Entra) sends group claims for each user. We would like users in the group "BLP-Plant-Supervisors" to receive the Supervisor role in Tessera and users in "BLP-Plant-Operators" to receive the Operator role, without assigning roles by hand for each person. We have located the SSO settings page but cannot find where group names are mapped to roles.

      Could you advise on the correct procedure, or confirm if this is not supported? We have copied Avery Chen as our account contact per our onboarding documentation.

      Kind regards,
  - id: m2
    beat_ref: null
