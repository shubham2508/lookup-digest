      Avery,

      Marcus's note last week that IPV is moving to diligence means we should get ahead of the term sheet. Here is what I'd like in order before one arrives, so we negotiate from a clean file rather than assembling one:

      1. Cap table refresh. The current version still shows the seed as a SAFE conversion estimate. Naomi will rebuild it from the executed documents so the pre-money share count is exact. You'll get it as v3 with the option pool worked in.
      2. Option pool. IPV will almost certainly ask for a pre-money pool top-up. We should settle our own number before they name theirs; 12% post is the usual opening ask, and your hiring plan supports arguing for less.
      3. Board composition. Today it's you, Priya and Diane. A lead will ask for a seat; the open questions are whether Diane keeps hers and whether an independent is added now or at the B.
      4. Cobalt pro rata. Diane's side letter gives Cobalt a pro rata right; we should confirm they intend to exercise it so the round math is right on the first draft.
      5. Housekeeping. Charter, bylaws, the CIIAAs Kim ran through DocuSign, and the customer MSAs are all in the data room as of this morning.

      Nothing is needed from you today. Items 1 and 2 will come to you as a draft from Naomi next week; 3 and 4 are worth a conversation with Diane before Marcus raises them.

      Ben
