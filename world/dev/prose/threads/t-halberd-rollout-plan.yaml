      Hi Renee,

      Attached: Halberd_Fresno_cutover_checklist_v1.pdf. Twenty-two items across three phases:

      1. T-7 to T-1: data freeze, final mapping import, SSO group sync, operator accounts (owner: me, with Joel).
      2. Go-live day, Oct 6: 05:00 switch-over before day shift, floor walk with the shift leads, 09:00 checkpoint with you (owner: me).
      3. T+1 to T+5: daily 15-minute check-in, open-issues list, T+5 sign-off (owner: you and me).

      Every item has a name and a time next to it. Happy to walk through it at tomorrow's weekly.

      Avery, nothing needed from you on this one; cc'ing so you have it.

      Best,
