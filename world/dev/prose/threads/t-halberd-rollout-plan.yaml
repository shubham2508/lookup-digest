      Two mapping questions that came up after you left:
      1. Work orders that span two shifts: one row with two shift codes, or two rows?
      2. Lines 3 and 4 share a PLC. Do we map them as one line and split on the station tag, or keep them separate?

      Thanks for driving up.

      Renee
