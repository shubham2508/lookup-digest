      Hi Renee,

      Thank you for the list, that is exactly what I needed. Proposal for the workshop:

      1. Tuesday, Sep 1, 10:00-12:00, at the plant. I'll drive up. Joel and the controls engineer in the room, plant manager optional.
      2. Attached: Halberd_Fresno_mapping_template_v1.xlsx. If Joel can fill in columns A-D (line, station, PLC tag, and the current work-order field names) before Tuesday, we'll spend the two hours on the hard cases instead of the easy ones.
