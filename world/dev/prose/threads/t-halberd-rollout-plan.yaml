      Avery,

      Good news from our side: the Fresno plant manager signed off yesterday, so we can set a date. I'd like to propose Oct 6 as go-live for Fresno. It's a Tuesday, it gives us five weeks, and it keeps us clear of quarter-end.

      Two questions so I can put names in our project sheet:
      1. Who on your side owns the rollout plan day to day?
      2. Who is my escalation point if something goes sideways?

      On our side it's me (project), Joel Brennan (IT and SSO) and the plant manager for the floor.

      Can we lock Oct 6?

      Renee
