    body: |
      Hi Yuki,

      Line 2 gets its tags loaded this week, so three quick ones before Marta's team starts pushing data:

      1. Do we reuse the Modesto site key from line 1, or does line 2 get its own? Our IT person set line 1 up as "MOD-01" and now nobody remembers whether that's the site or the line.
      2. The exception report - can it go to a distribution list (ops-modesto@) rather than named people? We've had two people rotate off since June and I keep forgetting to update it.
      3. Who on your side should Paul in AP send the PO change to? The line 2 add-on bumps our PO and I'd rather he not send it to you by accident.

      Not urgent-urgent, but Marta wants to start pushing Tuesday.

      Thanks!
      Grace
  - id: m2
    beat_ref: S6.b2
    day: 2
    time: "11:10"
