      Dear Avery,

      I hope the week has started well. As the first of October marks the anniversary of our agreement, I should like to begin the renewal paperwork on our side in good time, and to that end I would be grateful if you or Tomás could send over the proposed terms for the coming year: the subscription fee, any change to the usage tiers we discussed in June, and the term length you would propose. Our legal team will need roughly two weeks with the documents once the commercial points are agreed, so having the terms in hand by the middle of the month would let us sign comfortably before the anniversary.

      If it would be simpler to talk the terms through before putting them in writing, I am happy to make time for a call at your convenience.

      Kind regards,
