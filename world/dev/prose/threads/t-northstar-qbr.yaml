      Dates we can do: Sept 29 (Tue) afternoon, Sept 30 (Wed) any time after 11, Oct 1 (Thu) morning.

      Agenda from our side:
      - Line 2: what we're seeing vs. what we planned for (Marta)
      - Exception report changes and what's next
      - The invoice mix-up, briefly, so it doesn't repeat at renewal (Paul won't attend, I'll cover it)
