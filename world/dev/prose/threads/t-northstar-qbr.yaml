      Grace, this is great, thank you for taking the initiative - and for the agenda, that's basically the one I was going to send you!

      Three options from our side, all 60 minutes, all on Zoom unless you'd rather we come down to Modesto (we would genuinely love to, Yuki hasn't seen line 2 in person yet):

      Option A - Tue Sept 29, 2:00-3:00pm. Doable, but Yuki is at a customer training that morning and would join from the road, which is fine but not ideal for the line 2 walkthrough.

      Option B - Wed Sept 30, 1:00-2:00pm. Cleanest for us: Avery, Yuki and me all clear, and it's after your 11am cutoff. If Henrik's team can only do one slot, I'd push for this one.

      Option C - Thu Oct 1, 9:00-10:00am. Works for me and Yuki; Avery is double-booked that morning and would join for the second half only, which I'd rather avoid given the Henrik point.

      On the agenda - a few things I'd love to add, feel free to cut:

      1. A short usage recap (batches, tags, active users by line) - 5 minutes, Yuki will bring a one-pager. Halberd found this useful for their internal write-up.
      2. The downtime capture question Marta raised with Yuki last week - I'd rather we discuss it live than over email, there's a real product question in there about how we treat planned vs unplanned stops.
      3. Roadmap for Q4 - 10 minutes, nothing salesy, just so Henrik's team can see where the line 2 investment goes next. (I know, I know. I'll keep it tight!)
      4. Renewal timing - not the terms, just when you'd want to see them so Procurement isn't rushed in November.

      And yes to the invoice item, I'll own that one and keep it to two minutes: what happened, what we changed in billing so it doesn't recur (Kim has actually put a co-term check into our invoicing template because of this, so something good came out of it).

      Re Henrik - fully agree, and Avery, no pressure, but if you can make Option B it'd mean a lot to the Northstar side. I'll hold all three until Grace confirms.

      Tomás

      P.S. Marta's changeover - if she wants a second pair of eyes on the line 2 tag list before the 5th, Yuki has offered. Just say.
