      Sunday FYI because I can't help myself!!

      Remember the three prep questions I sent Dale at Ridgeway? He answered them. By fax. To the e-fax number in our website footer that I genuinely did not know still worked. One page, typed, signed in blue ink:

      1. Line B data: PLC historian, nightly CSV export, "our contractor can set it up".
      2. Three shifts, about 30 operators would look at it, "if it's simple".
      3. Plant network: owned by an IT contractor who's in two days a week. Wednesdays are one of them (!!).

      Also at the bottom, handwritten: "Bringing Bud, my plant manager. He keeps the real numbers." So Wednesday 2pm is Dale plus Bud plus Yuki plus me.

      The one-pager that got us here was Ana's idea: Marta's shift-summary screenshot (thank you Northstar), zero adjectives. I fought the adjectives thing. I was wrong!!

      No action for you, just wanted you to see it. Pipeline mail tomorrow as usual.

      Tomás
