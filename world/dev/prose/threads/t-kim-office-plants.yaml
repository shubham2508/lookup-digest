      Hi all,

      Two small office things, no action needed:

      1. Plants. Six new plants arrive Monday, September 21 (three pothos, two snake plants, one fiddle-leaf fig for the corner by the window). Total was $342.18 from Alameda Plant Co. The plant service will water every other Tuesday starting September 29, so please do not water them yourselves; the last fig did not survive our kindness.

      2. Kitchen. I did the restock this morning: oat milk, sparkling water (lime is back), the good coffee, and the granola people kept asking about. Snack budget for September is at $412 of $500, so we are fine.

      If you want something specific in the next order, add it to the Kitchen list in Notion by Wednesday.

      Enjoy the weekend,
      Kim
