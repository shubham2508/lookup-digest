      Avery - long day, so bear with me, but the first item needs you.

      Mei's offer letter. Jordan and I both signed Monday afternoon, so the letter has been sitting in your DocuSign queue since this morning (you'll have had the "awaiting your signature" email around 8:40). I spoke to Mei at about 3 this afternoon to check in, and the news is that her other offer expires Friday. She was very straight about it: Tessera is her first choice, but she won't let the other one lapse without a signed letter in hand, and I don't blame her. So the ask is simple - the signature takes about a minute, and it needs to happen before Friday. Thursday morning at the latest would give her a day to turn the other team down properly.

      Now the rest, which you can skip.

      The customer roundtable has five confirmed for October 8: Halberd, Northstar, Meridian (as a guest, not a customer yet - Carla asked nicely), Brightline and Ridgeway. I'd like you to open it, five minutes, no slides. Yuki will run the discussion. I'll put a hold on your calendar and you can decline it if the 8th is bad.

      Ana's v3 of the pricing deck is out and the Monday calls went well - the Line / Plant / Network naming got zero questions, which is the goal. She's asked whether she can drop the reference slide into the Meridian quote when it goes out; I said yes for Halberd and Northstar only, per your notes.

      Lastly, Kim asked me to remind everyone that Q3 expense reports close Wednesday. That includes me, so this reminder is at least partly for my own benefit.

      Thanks - and sorry for the wall of text on a Tuesday night.

      Tomás
