      Thanks Avery. Read it twice, and shared it with one partner (Iris) who got excited about the Halberd numbers.

      Two things I keep turning over:

      1. The gross margin trajectory. The appendix shows 71% trailing, and I'm trying to understand what the inference line does to that as backfill volume grows. Is the plan to get there with volume pricing, with model changes, or by pricing it through to customers?
      2. Concentration. Roughly how much of the ARR sits with the three reference accounts today, and what does that look like a year out on the current pipeline?

      Neither needs a written answer. I'm happy to dig in whenever you're ready; a 45-minute call would do it, and I'd bring Iris.

      David
