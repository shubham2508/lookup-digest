      Hi Avery,

      Really enjoyed our conversation at the Dogpatch dinner on Thursday. The bit about plant managers only trusting a forecast after it has been wrong in a way they can explain has stuck with me.

      Quick context on us: Aperture is a $180M fund, we lead and co-lead Series A rounds, and we've been building a supply-chain thesis for about a year (two investments so far, both on the logistics side, nothing yet on the plant floor). Tessera sits right in the gap.

      Would you be open to sending over the deck? Even the version you use with customers is fine. Two things I'm curious about, no need to answer by email: how you think about the reference-customer motion once you're past three, and whether the inference spend scales with lines or with plants.

      David
