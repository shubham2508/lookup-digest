# world/heldout/world.yaml — the held-out world's people, orgs and edges (specs/data_generation.md §3, §1 step 5).
# Never read by the digest. `truth` blocks feed the manifest only.
# All orgs, people, addresses and domains are fictional; Avery and Sam are never gendered.
#
# Same trap TYPES as world/dev, different disguises and different names. Names that profile/profile.md fixes stay
# (Avery, Sam, Wren, Priya, Marcus, Diane, Jordan, Tomás, Ben, Tessera, IPV, Wilson Sonsini, Halberd, Northstar,
# Veritas); every other person, org, address and domain is new. Reference-customer roles are rotated: the
# yes/no-question customer is Northstar, the cadence drop is Veritas, the procurement handover is Halberd.
#
# Time: days are relative (1..30). anchor = date of day 30.
#   day 1 = Wed 2026-02-25 (PST, -08:00) · day 12 = Sun 03-08, spring-forward · days 12–30 PDT (-07:00)
#   day 20 = Mon 03-16 · run days 26–30 = Sun 03-22 … Thu 03-26

world: heldout
anchor: 2026-03-26          # Thursday = day 30; `digest generate --anchor` overrides
timezone: America/Los_Angeles
run_days: [26, 27, 28, 29, 30]
as_of_time: "06:00"
seed: 11

company: {name: Tessera, domain: tessera.io, headcount: 12, arr_profile: "$3.2M", arr_actual: "$3.6M"}
avery: {id: avery, name: Avery Chen, email: avery@tessera.io}

