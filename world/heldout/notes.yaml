             stage_signals: [{entity: backend-2-req, stage: paused, day: 22}, {entity: clara-voss, stage: onsite, day: 22}, {entity: kenji-mori, stage: offer_approved, day: 22}],
             claims: [{subject: open_reqs, value: "one backend (offer going to Kenji) and a designer; second backend paused"}],
             action_items: [{owner: other, about: hiring-req:backend-2, due_day: null, status_in_thread: open}, {owner: other, about: candidate:clara-voss, due_day: null, status_in_thread: open}]}
  - file: infra-review.md
    kind: meeting_notes
    day: 21
    time: "10:45"
    attendees: [jordan, priya, arjun, felix, nora]
    title: "On-call & infra review - Mar 17"
    plants:
