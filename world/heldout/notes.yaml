             stage_signals: [{entity: halberd, stage: at_risk, day: 27}],
             claims: [{subject: halberd_renewal_timing, value: "after our fiscal close"}, {subject: veritas_vendor_review, value: "Hugo running an annual vendor review"}],
             action_items: [{owner: other, about: renewal:halberd, due_day: null, status_in_thread: open}]}
  - file: hiring-sync.md
    kind: meeting_notes
    day: 22
    time: "11:30"
    attendees: [avery, jordan, tomas]
    title: "Hiring sync - Mar 18"
    plants:
