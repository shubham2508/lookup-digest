# world/heldout/notes.yaml — the 10 notes and tasks.md (specs/data_generation.md §7). Each note's first line is
# "Date: YYYY-MM-DD | Attendees: …" (dates resolve from `day` via the anchor 2026-03-26). File mtimes are set to the
# note's day at `time`. The prose files under prose/notes/ carry the full text; this file fixes what each must plant.
# Same shape as world/dev/notes.yaml; the README's "Pinned shared sources" table is binding for file/kind/day/time/
# attendees/must_include. Day → date: 2 = Thu 02-26 · 19 = Sun 03-15 · 20 = Mon 03-16 · 21 = Tue 03-17 · 22 = Wed 03-18
# · 27 = Mon 03-23 · 28 = Tue 03-24 · 29 = Wed 03-25 · 30 = Thu 03-26.

notes:
  - file: board-meeting-minutes.md
    kind: meeting_notes
    day: 2
    time: "16:45"
    attendees: [avery, priya, diane, nora]
    title: "Board meeting - Feb 26"
    plants:
      - "Diane: a short written update to the board every month until the round closes. Agreed (Avery). Last one went out Feb 9; next due around Mar 9."
      - "ARR $3.2M as of Jan 31 (consistent with the profile at the time)"
      - "Series A: IPV partnership pitch second week of March (Owen running logistics); Larkspur first call Feb 27 via Diane"
      - "Hiring: two backend reqs (one via Northbeam, retained) + designer open"
    must_include: ["every month until the round closes", "Feb 9"]
    labels: {storyline: S10, about: [board-update:monthly], agreements: [{rule: "a short written update every month until the round closes", cadence: monthly}],
             claims: [{subject: last_board_update_sent, value: "Feb 9"}, {subject: ARR, value: "$3.2M"}]}
    cadence_math: "Feb 9 + 1 month = Mar 9; on day 26 (Mar 22) days_since 41 / days_overdue 13; on day 30 (Mar 26) days_since 45 / days_overdue 17"
  - file: investor-update-draft.md
    kind: draft
    day: 19
    time: "22:05"
    attendees: []
    title: "March investor update - DRAFT"
    plants:
      - "half-written Sunday-night draft; metrics block says 'ARR: $3.2M' (stale); 'Net revenue retention: TBD'; 'Pipeline: TBD'; asks section unfinished"
    must_include: ["$3.2M", "TBD"]
    labels: {storyline: S10, about: [board-update:monthly], note_kind: draft, draft_of: "investor update", claims: [{subject: ARR, value: "$3.2M"}]}
  - file: finance-review.md
    kind: meeting_notes
    day: 21
    time: "16:00"
    attendees: [avery, nora, priya]
    title: "Finance review - Mar 17"
    plants:
      - "ARR $3.6M as of Mar 15 (Northstar SAP connector + second plant, Coastline expansion, Halberd Line 3 pilot uplift)"
      - "GPU reserved commit ends 3/31; provider raises on-demand pricing Apr 1; Priya to recommend before the 31st; needs Avery's yes/no (→ S13)"
      - "Payroll funding account switched to the new bank (Cascade Community Bank) effective the Mar 25 run; Nora to confirm the first debit clears (→ background Gusto failure day 28)"
      - "Feb expenses: three Brex reports still unsubmitted; approvals to Avery once they land (→ BG-expenses, day 27)"
      - "Cash $3.9M, ~16 months pre-round"
    must_include: ["ARR $3.6M", "GPU reserved commit"]
    labels: {storyline: [S10, S13], about: [board-update:monthly, other:gpu-commit-decision], claims: [{subject: ARR, value: "$3.6M"}, {subject: gpu_commit_expiry, value: "3/31"}],
             action_items: [{owner: other, about: other:gpu-commit-decision, due_day: null, status_in_thread: open}]}
  - file: h1-planning.md
    kind: draft
    day: 27
    time: "17:20"
    attendees: []
    title: "H1 FY27 (Apr-Sep) planning doc - owner Avery"
    plants:
      - "two open comments: Jordan (day 28 17:35, on-call headcount if Kenji slips) and Priya (day 29 08:44, budget assumes a 1-year GPU renewal nobody has approved) - rendered as inline comment blocks with dates"
      - "security line: 'Quillon Security trial — decision hinges on evidence collection coverage'; 'Bastion Compliance ... auto-renews 3/27 for 12 months unless we cancel'"
      - "review at the Thu 3/26 14:00 planning sync"
    must_include: ["evidence collection", "open comment"]
    labels: {storyline: BG-h1, about: [report:h1-planning, meeting:quillon-demo, renewal:bastion], note_kind: draft, draft_of: "H1 planning doc",
             open_comments: [{by: jordan, status: open}, {by: priya, status: open}], claims: [{subject: quillon_eval_criteria, value: "evidence collection coverage"}, {subject: bastion_renewal, value: "3/27"}]}
    mtime_note: "file mtime = day 29 08:50 (Priya's comment), so on day 30 the note is fresh"
  - file: eng-standup.md
    kind: status
    day: 28
    time: "09:40"
    attendees: [jordan, arjun, felix, kofi, carmen, hana]
    title: "Standup notes - week of Mar 23"
    plants:
      - "Northstar SAP connector: on track for Apr 1 (cutover runbook v2 sent to Elise and Rosa)"
      - "Two non-blocking issues from Carmen's regression pass: NS-412 CSV export plant-code column; NS-415 date picker shows UTC - neither in the go-live path"
      - "Halberd Line 3 MES upgrade (Sanjay's team) Wed evening 3/25 from 18:00; Arjun on call, Felix backup (→ S14 incident that night)"
    must_include: ["on track for Apr 1", "non-blocking"]
    labels: {storyline: [S5, S14], about: [rollout:northstar:apr-1, incident:halberd:timestamps], note_kind: status,
             claims: [{subject: northstar_connector_status, value: "on track for Apr 1"}, {subject: halberd_mes_upgrade, value: "Wed evening 3/25, Arjun on call"}]}
    about_note: "the MES-upgrade line is the pre-incident context S14 cites (dev: jordan-1on1.md's schema-risk line); labeled with the incident key so the note joins the incident item"
  - file: gtm-weekly.md
    kind: meeting_notes
    day: 27
    time: "16:10"
    attendees: [avery, tomas, leo, hana]
    title: "GTM weekly - Mar 23"
    plants:
      - "Halberd: Martin (CFO) pushed the renewal again — now 'after our fiscal close' (FY ends Apr 30). 2nd push; first was mid-Feb → end of March. Tomás to get a date in writing."
