last_modified_header: "every rendered note and tasks.md starts with '<!-- last-modified: <ISO datetime PT> -->' (OPEN_QUESTIONS #6c) so staleness survives git clone; the file mtime is set to the same instant"

tasks:
  file: tasks.md
  mtime_day: 18                 # Sat 03-14; 12 days before day 30 (data_generation §7); stale on every run day (>7 days; 8 on day 26)
  mtime_time: "18:05"
  format: "- [ ] <title> (due: YYYY-MM-DD)"
  items:
    - {id: "task:1", title: "Send Diane the March investor update", due_day: 20, status: open, labels: {about: board-update:monthly, storyline: S10}, note: "due Mon 3/16; overdue on every run day; duplicated in avery-todos.md with 'by 3/13'"}
    - {id: "task:2", title: "Finalize H1 planning doc for Thursday's sync", due_day: 30, status: open, labels: {about: report:h1-planning, storyline: BG-h1}, note: "the one due today (day 30); h1-planning-sync-20260326 14:00 is the review"}
    - {id: "task:3", title: "Approve February expenses in Brex", due_day: 25, status: open, labels: {about: approval:expenses-february, storyline: BG-expenses}, note: "Sat 3/21; merges with the three Brex reports of day 27"}
    - {id: "task:4", title: "Send Northstar the pen-test summary", due_day: 16, status: open, labels: {about: report:pentest-northstar, storyline: BG-pentest}, note: "due Thu 3/12; already done per email on day 16 (S5 history) → stale task / tasks-vs-email contradiction"}
    - {id: "task:5", title: "Review cyber policy renewal from Keel", due_day: 55, status: open, labels: {about: other:cyber-renewal, storyline: BG-keel}, note: "Mon 4/20; far out; must not surface"}
  absent: [deal:series-a:operating-model, report:409a-draft]     # S1 promise and S16 promise are in no task or todo
