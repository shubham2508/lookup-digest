  - file: avery-todos.md
    kind: todo
    day: 20
    time: "07:40"
    attendees: []
    title: "todos (personal scratch)"
    plants:
      - "- send Diane the March update (by 3/13)        ← duplicated in tasks.md (task:1, due 3/16) with a different date; both are one item"
      - "- pen-test summary to Northstar                 ← already done per email on day 16 (S5 history); with tasks.md task:4 → one tasks-vs-email contradiction"
