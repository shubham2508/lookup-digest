  - {id: scmorning,     name: Supply Chain Morning,      from: "morning@scmorning.co",            cadence: daily,        topics: [supply-chain, regulation], note: "nl-scmorning-318 is the EU CRA decoy"}
  - {id: runwaynotes,   name: Runway Notes,              from: "letters@runwaynotes.co",          cadence: Thu,          topics: [saas-metrics, fundraising], note: "well-known-style operator letter: one long essay, SaaS benchmarks, 'this week's round-up' footer"}
