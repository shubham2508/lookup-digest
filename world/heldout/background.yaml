      - {id: BG-hv-no-individual-d30, kind: item_absent,      run_day: 30, args: {source_id: t-hirevector-3}}
      - {id: BG-hv-no-draft,       kind: no_draft_to,         run_day: 29, args: {contact: brandon.pierce@hirevector.io}}
      - {id: BG-hv-no-draft-alyssa, kind: no_draft_to,        run_day: 29, args: {contact: alyssa.moon@hirevector.io}}
      - {id: BG-hv-absent-d28,     kind: candidate_absent,    run_day: 28, args: {type: recruiter_pattern, about: other:recruiter-hirevector}, description: "two in window on day 28"}
      - {id: BG-hv-category,       kind: contact_category_is, run_day: 29, args: {email: brandon.pierce@hirevector.io, category: cold_inbound}}
      - {id: BG-hv-d30-max-one,    kind: count_items_of_type, run_day: 30, args: {type: recruiter_pattern, max: 1}, description: "no duplicate pattern line, no second firm"}
