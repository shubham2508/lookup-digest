  - {id: eastbayfounders, name: East Bay Founders Weekly, from: "hello@eastbayfounders.org",      cadence: Fri,          topics: [local]}

planted_patterns:
  talentbridge:                     # mechanism slot (generator key); held-out disguise = HireVector
    disguise: HireVector
    description: "3 cold recruiter emails from one firm inside a 7-day window (days 23, 26, 28; span 5 days) → exactly one recruiter_pattern line, no individual items, no drafts. The third lands day 28 14:35, so the pattern first appears on the day-29 run."
    items:
      - {id: t-hirevector-1, day: 23, time: "10:15", from: brandon, subject: "Senior backend engineers - top 1% talent for Tessera",        category: recruiters, must_not_surface: true, must_not_reason: lone_recruiter_until_pattern}
      - {id: t-hirevector-2, day: 26, time: "09:10", from: alyssa,  subject: "Circling back on Brandon's note - backend hiring at Tessera", category: recruiters, must_not_surface: true, must_not_reason: lone_recruiter_until_pattern}
      - {id: t-hirevector-3, day: 28, time: "14:35", from: brandon, subject: "Re: Senior backend engineers - last try",                    category: recruiters, must_not_surface: true, must_not_reason: individual_recruiter_pattern_only}
    expectations:
      - {run_day: 26, absent: [other:recruiter-hirevector], notes: "one in window; Alyssa's Sunday mail lands 09:10, after the run"}
      - {run_day: 27, absent: [other:recruiter-hirevector], notes: "two in window"}
      - {run_day: 28, absent: [other:recruiter-hirevector], notes: "two in window; the third arrives 14:35, after the run"}
      - {run_day: 29, candidates: [{type: recruiter_pattern, about: other:recruiter-hirevector, facts_hint: {count: 3, window_days: 7, span_days: 5}}],
         items: [{about: other:recruiter-hirevector, priority: P3, section: pulse, actions: [], cites_any: [t-hirevector-1, t-hirevector-2, t-hirevector-3], notes: "first appearance: one pattern line; no action, no draft"}]}
      - {run_day: 30, candidates: [{type: recruiter_pattern, about: other:recruiter-hirevector, facts_hint: {count: 3, window_days: 7, note: "day 23 is exactly 7 days before the run; still one firm, three mails, five-day span"}}],
         items: [{about: other:recruiter-hirevector, priority: P3, section: pulse, actions: [], cites_any: [t-hirevector-1, t-hirevector-2, t-hirevector-3], notes: "a one-liner or 'Also pending' line is acceptable; presence is not asserted on day 30 (lookback boundary), only that there is at most one pattern line and no individual items"}]}
    assertions:
      - {id: BG-hv-one-pattern,    kind: count_items_of_type, run_day: 29, args: {type: recruiter_pattern, equals: 1}, description: "eval.md §3 Recruiters: exactly one HireVector pattern line on the first run it qualifies (day 29)"}
