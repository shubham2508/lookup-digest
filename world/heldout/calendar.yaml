# world/heldout/calendar.yaml — every event rendered into data/heldout/calendar/work.ics and shared_family.ics.
# Times PT. `day` is world-relative (negative = before day 1, for recurring series starts). created/last_modified are
# realistic (invites are created days before, Sam's family events at odd evening hours). PARTSTAT per attendee.
# uid values are the `event:<uid>` source ids the manifest cites.
#
# Held-out time table: day 1 = Wed 2026-02-25 (PST) · day 12 = Sun 03-08 (spring-forward) · days 12–30 PDT ·
# day 30 = Thu 2026-03-26. Weekday of day d = Wed + (d-1) mod 7, so every `from_day` below lands on a weekday that
# matches its BYDAY (e.g. -21 = Tue 02-03, -47 = Thu 01-08, -57 = Mon 2025-12-29).
# DST: every series that starts before Mar 8 is rendered with DTSTART;TZID=America/Los_Angeles + RRULE, so the wall-
# clock time (09:00 deep work, 12:30 lunch, ...) is unchanged on both sides of the change; nothing here is in UTC.

