    category: hiring
    storyline: S8
    must_not_surface: true
    must_not_reason: fyi_progress_thread
    expected:
      type: human_thread
      domain: work
      intent_primary: commitment_update
      about: [candidate:kenji-mori, offer:kenji-mori]
      ball_awaiting: nobody
      closed_by_courtesy: false
      sender_relationship: {category: team, subtype: exec}
      stage_signals:
        - {entity: kenji-mori, stage: onsite, day: 10}
        - {entity: kenji-mori, stage: debrief, day: 20}
        - {entity: kenji-mori, stage: offer_extended, day: 24}    # verbal, accepted on the call
        - {entity: kenji-mori, stage: offer_extended, day: 27}    # written letter sent
      asks: [{to_avery: true, kind: approval, status: answered}]
      commitments: [{owner: other, about: offer:kenji-mori, due_day: 27, status_in_thread: fulfilled}]   # "letter goes out Monday" → sent day 27
  - thread: t-kenji-thanks
    category: hiring
    storyline: S8
    must_not_surface: true
    must_not_reason: courtesy_no_ask
    classification_case: candidate_courtesy_note
    expected: {type: human_thread, domain: work, intent_primary: social, about: [candidate:kenji-mori], ball_awaiting: nobody, closed_by_courtesy: true,
               sender_relationship: {category: hiring, subtype: candidate, stage: onsite}}
  - automated: auto-dropboxsign-kenji
    category: notifications
    storyline: S8
    classification_case: docusign_action_vs_github_fyi     # spec §6 case name kept; the held-out instance is Dropbox Sign vs Linear/Ashby/Sentry
    expected:
      type: automated
      automated: {system: "Dropbox Sign", action_bearing: true, action_kind: signature, about: offer:kenji-mori}
  - thread: t-kenji-offer
    category: hiring
    storyline: S8
    expected:
      type: human_thread
      domain: work
      intent_primary: ask
      about: [offer:kenji-mori]
      ball_awaiting: avery
      closed_by_courtesy: false
      sender_relationship: {category: team, subtype: exec}
      asks: [{to_avery: true, kind: signature, deadline_day: 31, status: open}]
      stage_signals: [{entity: kenji-mori, stage: offer_extended, day: 27}]
      claims: [{subject: competing_offer_deadline, value: "Friday noon"}]
      suspicious: false
    messages:
      - {beat_ref: S8.b8, day: 28, time: "18:35", from: jordan, to: [avery], cc: [nora], must_include: ["Friday noon", "Dropbox Sign"]}

contacts:
  - {id: kenji, category: hiring, subtype: candidate, tier: P1, stages: [{from_day: 10, stage: onsite}, {from_day: 20, stage: debrief}, {from_day: 27, stage: offer_extended}],
     note: "offer-stage candidate → high prior; the day-24 verbal (t-kenji-loop m4) is the stage signal that keeps days-since-stage at 3 on the day-27 run"}

