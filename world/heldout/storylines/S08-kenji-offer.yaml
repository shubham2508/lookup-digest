id: S8
name: kenji-offer
reviewed: true
tier_truth: P1
summary: >
  Kenji Mori, backend engineer candidate for the first backend req: onsite Friday day 10, debrief Monday day 20
  (Jordan recommends an offer at the top of the band), offer approved at the Wednesday day-22 hiring sync
  (hiring-sync.md), verbal made Friday day 24 (a stage signal that keeps days-since-stage at 3 on the day-27 run, so
  the offer-stage candidate never trips the 5-day stall rule), letter sent Monday day 27 through Dropbox Sign,
  "awaiting your signature" lands Tuesday day 28 at 08:15 (21.75 h pending at the day-29 run, 45.75 h at day 30).
  Tuesday 18:35 Jordan emails that Kenji signed Monday night, Jordan countersigned Tuesday morning, and Kenji's
  competing offer expires Friday noon. Tests: `approve` with a deadline from an automated action-bearing email plus a
  human thread; Dropbox Sign (action) vs Linear/Ashby/Sentry notifications (FYI); the candidate's own courtesy note
  must not surface; second-day escalation framing.

threads:
  - {id: t-kenji-loop,    subject: "Kenji Mori - backend loop",                              category: hiring}
  - {id: t-kenji-offer,   subject: "Kenji - offer letter in Dropbox Sign, deadline Friday",   category: hiring}
  - {id: t-kenji-thanks,  subject: "Thank you - Tessera onsite",                              category: hiring}
automated:
  - {id: auto-dropboxsign-kenji, system: "Dropbox Sign", day: 28, time: "08:15", category: notifications,
     subject: "Nora Blake has requested your signature: Offer Letter - Kenji Mori.pdf"}

beats:
  - {ref: S8.b1, day: 10, time: "17:35", source: email, thread: t-kenji-loop,   from: jordan, to: [avery], cc: [nora],
     event: "onsite done today (Friday); panel positive; debrief held to the week of the 16th because Arjun is out"}
  - {ref: S8.b2, day: 10, time: "20:40", source: email, thread: t-kenji-thanks, from: kenji,  to: [jordan], cc: [avery],
     event: "thank-you note after the onsite; explicitly no questions; mentions family logistics without asking anything", must_include: ["Thank you"], hardness: [ps, mixed_topics]}
  - {ref: S8.b3, day: 20, time: "12:20", source: email, thread: t-kenji-loop,   from: jordan, to: [avery], cc: [nora],
     event: "debrief done: unanimous hire; recommends the offer at the top of the band ($198k base); asks Avery to approve at Wednesday's hiring sync", must_include: ["top of the band"]}
  - {ref: S8.b4, day: 20, time: "13:45", source: email, thread: t-kenji-loop,   from: avery,  to: [jordan], cc: [nora],
     event: "approved in principle; make it official at the hiring sync so Nora can walk through the grant math", must_include: ["hiring sync"], hardness: [indirect]}
  - {ref: S8.n1, day: 22, time: "11:30", source: note, note: hiring-sync.md,
     event: "hiring sync records 'Kenji offer approved' (the note is planted and labeled by S9; S8 cites it only as history)"}
  - {ref: S8.b5, day: 24, time: "16:50", source: email, thread: t-kenji-loop,   from: jordan, to: [avery], cc: [nora],
     event: "verbal offer made and accepted this afternoon; Kenji wants the weekend for family logistics; letter goes out Monday via Dropbox Sign, routing Kenji → Jordan → Avery; 'no action for you until the envelope reaches you'", must_include: ["verbal"]}
  - {ref: S8.b6, day: 27, time: "10:40", source: email, thread: t-kenji-loop,   from: jordan, to: [avery], cc: [nora],
     event: "letter went out 09:30 via Dropbox Sign; Kenji signs tonight; Avery gets the Dropbox Sign email 'probably tomorrow'; two unrelated FYIs", must_include: ["Dropbox Sign"], hardness: [mixed_topics]}
  - {ref: S8.b7, day: 28, time: "08:15", source: automated, automated: auto-dropboxsign-kenji, from: dropboxsign, to: [avery],
     event: "Dropbox Sign: Offer Letter - Kenji Mori.pdf awaiting your signature; Kenji Mori signed Mar 23 19:48, Jordan Liu signed Mar 24 08:12", must_include: ["awaiting your signature", "Kenji Mori"]}
  - {ref: S8.b8, day: 28, time: "18:35", source: email, thread: t-kenji-offer,  from: jordan, to: [avery], cc: [nora],
     event: "Kenji signed Monday night, Jordan countersigned Tuesday 08:12; the envelope is in Avery's Dropbox Sign queue; Kenji's other offer expires Friday noon and he wants Tessera's letter executed first; unrelated Coastline FYI", must_include: ["Friday noon", "Dropbox Sign"], hardness: [mixed_topics]}

labels:
