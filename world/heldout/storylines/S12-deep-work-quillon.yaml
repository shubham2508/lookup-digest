id: S12
name: deep-work-quillon
reviewed: false
tier_truth: P2
summary: >
  Held-out disguise of dev S12. Avery blocks Tue/Thu 09:00–11:00 as "Deep work" (recurring, organizer Avery). Avery
  also organizes the weekly Thursday 10:30–11:00 "Architecture review - Priya / Avery", which sits inside the block by
  Avery's own choice. On Tuesday day 28 at 16:50 Maya Castellanos (Quillon Security, the compliance vendor under
  consideration to replace Bastion) sends an invite for a demo on Thursday day 30 09:30–10:15 (organizer Maya, Avery
  NEEDS-ACTION, Priya ACCEPTED) and an email asking Avery to choose between a pen-test scoping session and a SOC 2
  evidence automation walkthrough. h1-planning.md says the Quillon decision hinges on evidence collection coverage
  and that Bastion renews 3/27. Tests: organizer-aware deep-work flag (Quillon yes, architecture review no);
  `calendar_response` phrased as a proposal plus a `decide` on the agenda with a recommendation; the Bastion
  auto-renewal notice (background item, day 31) is the context.

