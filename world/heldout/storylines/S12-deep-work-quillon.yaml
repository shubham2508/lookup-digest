events:
  - {uid: deep-work-tue-thu, calendar: work, title: "Deep work", rrule: "FREQ=WEEKLY;BYDAY=TU,TH", start: "09:00", end: "11:00", organizer: avery, attendees: [], from_day: -21}
  - {uid: arch-review-thu, calendar: work, title: "Architecture review - Priya / Avery", rrule: "FREQ=WEEKLY;BYDAY=TH", start: "10:30", end: "11:00", organizer: avery,
     attendees: [{id: priya, partstat: ACCEPTED}], from_day: -35, note: "inside the deep-work block by Avery's choice: never a violation"}
  - {uid: quillon-demo-20260326, calendar: work, title: "Quillon Security <> Tessera - demo", day: 30, start: "09:30", end: "10:15", organizer: maya,
     attendees: [{id: avery, partstat: NEEDS-ACTION}, {id: priya, partstat: ACCEPTED}, {id: maya, partstat: ACCEPTED}], created_day: 28, created_time: "16:50",
     last_modified_day: 28, location: "Google Meet (link in description)"}

