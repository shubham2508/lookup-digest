id: S4
name: larkspur-quiet
reviewed: true
tier_truth: P0
summary: >
  Held-out disguise of dev S4. Farah Siddiqui (General Partner, Larkspur Partners; not in the profile) came in
  through Diane's intro email on the evening of day 2 (Thu Feb 26, after the board meeting); board-meeting-minutes.md
  records "Larkspur first call Feb 27 via Diane". Day 3 (Fri Feb 27): a 20-minute intro call at 1pm, then Farah asks
  for a working session with Priya; Avery books Wednesday day 8 (Mar 4) 14:00 and has the last word (thread
  t-larkspur-intro, closed). Day 10 (Fri Mar 6): Farah's thoughtful follow-up on the session ends with one pointed
  question about plant-expansion cohorts (new thread t-larkspur-followup); Avery replies "I'll send the cohort data
  and we'll find time after the 15th". Nothing since. Avery owns the next step and the 15th (Sun Mar 15, day 19) is
  a week gone by the first run. Capital thread with Avery's own open commitment → quiet_thread on every run day:
  business days quiet (weekdays strictly after Fri 03-06, strictly before the run date) = 10 on days 26 and 27, 11
  on day 28, 12 on day 29, 13 on day 30. Tests: quiet prospective investor during an active raise; Larkspur is
  classified capital from the signature/domain (plus Diane's intro); the closed intro thread shares the about key
  without producing its own item; the draft is dispatchable (propose two slots, say when the cohort data lands).

threads:
  - {id: t-larkspur-intro,    subject: "Intro: Farah Siddiqui (Larkspur) <> Avery Chen (Tessera)", category: investors_board}
  - {id: t-larkspur-followup, subject: "Following up from Wednesday",                                category: investors_board}

beats:
  - {ref: S4.h1, day: 2, time: "18:10", source: email, thread: t-larkspur-intro, from: diane, to: [avery, farah],
     event: "intro after the board meeting: Farah is building a thesis around software for industrial operators and asked who in Granite Bay's portfolio to talk to; leaves them to find a time",
     must_include: ["Farah"], hardness: []}
  - {ref: S4.h2, day: 3, time: "08:50", source: email, thread: t-larkspur-intro, from: farah, to: [avery], cc: [diane],
     event: "thanks Diane; offers twenty minutes at 1pm today or Monday afternoon",
     must_include: ["1pm"], hardness: []}
  - {ref: S4.h3, day: 3, time: "09:20", source: email, thread: t-larkspur-intro, from: avery, to: [farah], cc: [diane],
     event: "1pm today works; mobile number",
     must_include: ["1pm"], hardness: [lowercase]}
  - {ref: S4.h4, day: 3, time: "14:35", source: email, thread: t-larkspur-intro, from: farah, to: [avery],
     event: "after the call: two things that stayed with her; asks for a proper working session next week with Priya in the room, proposes Wednesday March 4 at 2pm; one question about who signs the second line",
     must_include: ["Priya", "March 4"], hardness: [long]}
  - {ref: S4.h5, day: 3, time: "16:50", source: email, thread: t-larkspur-intro, from: avery, to: [farah],
     event: "wed the 4th at 2pm works, invite coming, Priya will be on; answers the question in one line; last word Avery (closed)",
     must_include: ["2pm"], hardness: [lowercase]}
  - {ref: S4.b1, day: 10, time: "10:40", source: email, thread: t-larkspur-followup, from: farah, to: [avery], cc: [priya],
     event: "thanks both for Wednesday; Larkspur is interested and wants to bring Tessera to the April partner meeting; one pointed question: by cohort of plants (grouped by go-live quarter), how many added a second line, how quickly, and what it did to contract value; asks for the data behind the sentence Avery said on Wednesday",
     must_include: ["cohort"], hardness: [long, indirect_phrasing]}
  - {ref: S4.b2, day: 10, time: "16:05", source: email, thread: t-larkspur-followup, from: avery, to: [farah], cc: [priya],
     event: "the cohort view exists (Nora keeps it by go-live quarter); will send the cohort data and find time after the 15th, once the partnership pitch is behind us",
     must_include: ["I'll send the cohort data and we'll find time after the 15th"], hardness: [lowercase]}

