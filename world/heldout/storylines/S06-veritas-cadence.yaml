     note: "cadence: baseline median ~1.5 days (11 inbound, days 1–20), then one inbound on Fri day 24 15:45; current gap ≥ 3.59 days from day 28. world.yaml truth should say day 24, not day 25 (a Saturday)"}
  - {id: hugo,   category: customer, subtype: reference_exec, tier: P1, stages: [{from_day: 29, stage: renewal_window}],
     note: "appears only inside Tomás's forward (msgs 1, 3, 5, 10); Tomás's forward at 22:05 day 29 is when Avery first sees him"}
  - {id: anika,  category: customer, subtype: reference_ic, tier: null}

about_keys:
  should_merge: [[renewal:veritas, renewal:veritas-components], [other:veritas-cadence, other:veritas-reply-cadence]]
  should_not_merge: [[other:veritas-cadence, renewal:veritas], [renewal:veritas, renewal:halberd], [renewal:veritas, invoice:veritas:po-88-4471], [renewal:veritas, other:veritas-lot-hold-request]]

expectations:
  - run_day: 26
    absent: [other:veritas-cadence, renewal:veritas]
    notes: "current gap 1.59 days (Dmitri's last inbound Fri day 24 15:45)"
    noise: [t-veritas-lot-trace, t-veritas-alerts, t-veritas-po, t-veritas-qbr]
  - run_day: 27
    absent: [other:veritas-cadence, renewal:veritas]
    notes: "current gap 2.59 days < 3 → no candidate yet; gtm-weekly.md lands at 16:10, after the run"
    noise: [t-veritas-lot-trace, t-veritas-alerts, t-veritas-po, t-veritas-qbr]
  - run_day: 28
    candidates: [{type: cadence_drop, about: other:veritas-cadence, facts_hint: {baseline_median_days: 1.5, recent_median_days: 3.8, current_gap_days: 3.59}}]
    items: [{about: other:veritas-cadence, priority: P2, section: pulse, actions: [watch], cites_any: [t-veritas-po, "note:customer-health-review.md"],
             ambiguity: preference, notes: "'pattern, not action'; a question card (Tomás checks in / Avery reaches out / keep watching) is welcome but optional on a normal run"}]
    unasserted: "renewal:veritas — gtm-weekly.md (day 27) mentions Hugo running a vendor review with no ask and Leo on the thread; a pulse one-liner is acceptable, not required, so neither present nor absent is scored"
    noise: [t-veritas-lot-trace, t-veritas-alerts, t-veritas-po, t-veritas-qbr]
  - run_day: 29
    candidates: [{type: cadence_drop, about: other:veritas-cadence, facts_hint: {current_gap_days: 4.59}}]
    items: [{about: other:veritas-cadence, priority: P2, section: pulse, actions: [watch], cites_any: [t-veritas-po, "note:customer-health-review.md"]}]
    unasserted: "renewal:veritas — same as day 28"
    noise: [t-veritas-lot-trace, t-veritas-alerts, t-veritas-po, t-veritas-qbr]
  - run_day: 30
    candidates:
      - {type: cadence_drop, about: other:veritas-cadence, facts_hint: {current_gap_days: 5.59}}
      - {type: reply_owed,   about: renewal:veritas, facts_hint: {note: "Tomás's forward, 'thoughts?'"}}
    items:
      - {about: other:veritas-cadence, priority: P2, section: pulse, actions: [watch], cites_any: [t-veritas-po, "note:customer-health-review.md"]}
      - {about: renewal:veritas, priority: P1, section: decisions, actions_any: [question, read], cites_any: [t-fwd-veritas-vendor-review],
         ambiguity: preference,
         notes: "read_start = Hugo's message (msg 10, 'annual vendor review' / 'formal vendor review'); if a question card: (1) Avery calls Hugo (2) Tomás owns it (3) watch. Must not be summarised as 'billing thread' or 'lot-hold feature request'."}
    noise: [t-veritas-lot-trace, t-veritas-alerts, t-veritas-po, t-veritas-qbr]
    notes: "the forward's inner messages are from Hugo/Anika to Leo/Hana (Dmitri and Tomás cc'd); they must not count as Dmitri's inbound (cadence stays dropped)"

assertions:
  - {id: S6-d27-no-cadence,        kind: candidate_absent,    run_day: 27, args: {type: cadence_drop, about: other:veritas-cadence}, description: "gap 2.59 < 3"}
  - {id: S6-d28-cadence,           kind: candidate_present,   run_day: 28, args: {type: cadence_drop, about: other:veritas-cadence}}
  - {id: S6-d28-watch,             kind: item_present,        run_day: 28, args: {about: other:veritas-cadence, section: pulse, actions_any: [watch]}}
  - {id: S6-d30-cadence-watch,     kind: action_present,      run_day: 30, args: {about: other:veritas-cadence, action: watch}}
  - {id: S6-d30-fwd-present,       kind: item_present,        run_day: 30, args: {about: renewal:veritas, priority: P1, actions_any: [question, read]}}
  - {id: S6-d30-fwd-no-fake-draft, kind: action_absent,       run_day: 30, args: {about: renewal:veritas, action: reply},
     description: "a 12-message forward with no context is not dispatchable; no fake reply draft"}
  - {id: S6-d30-two-items,         kind: count_items_of_type, run_day: 30, args: {type: cadence_drop, equals: 1}}
  - {id: S6-dmitri-category,       kind: contact_category_is, run_day: 30, args: {email: dmitri.volkov@veritascomponents.com, category: customer, subtype: reference}}
  - {id: S6-po-absent,             kind: item_absent,         run_day: 30, args: {source_id: t-veritas-po}}

sim_avery:
  - {scope_about: other:veritas-cadence, intended_option: 1, rationale: "Tomás checks in with Dmitri; stop showing the cadence unless something changes"}
  - {scope_about: renewal:veritas,       intended_option: 1, rationale: "Avery calls Hugo personally; a formal vendor review on a reference account is a renewal risk"}
simulate:
  - {id: S6-sim-ruling-applied, kind: ruling_applied, run_day: 29, args: {question_scope: other:veritas-cadence, expected_change: "day 29 cadence item suppressed or one-liner; header counts an applied rule", mode: simulate}}
  - {id: S6-sim-content-overrides, kind: content_overrides_ruling, run_day: 30, args: {about: renewal:veritas, mode: simulate},
     description: "the day-28 ruling (delegate, suppress) does not hide Hugo's 'formal vendor review'"}
variants: []
