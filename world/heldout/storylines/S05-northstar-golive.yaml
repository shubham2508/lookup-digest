id: S5
name: northstar-golive
reviewed: false
tier_truth: P1
summary: >
  Northstar Foods is the healthiest reference customer this month: procurement lead Elise Moreau emails on a steady
  ~3-day cadence all month (inbound days 2, 6, 9, 13, 16, 17, 20, 23, 27, 29: SAP connector go-live planning with
  Hana, a pen-test summary for their vendor security file sent by Arjun on day 16, an invoice reissue closed by Nora,
  scheduler training for the Fresno planners). On Wednesday day 29 at 13:52 Elise asks Avery whether the April 1 SAP
  connector go-live is still on; her ops council meets Friday 7am and she needs to confirm by end of Thursday.
  eng-standup.md (Tue day 28, 09:40) says the connector is on track for Apr 1 with two non-blocking issues. Plant Ops
  Digest #112 (day 29 06:45) reports Northstar's Fresno plant digitization without naming Tessera. tasks.md task 4
  ("Send Northstar the pen-test summary", due day 16) and avery-todos.md ("pen-test summary to Northstar", day 20) are
  both stale: Arjun sent it on day 16 and Elise confirmed receipt the same afternoon (tasks-vs-email contradiction
  about report:pentest-northstar). Tests: same-day `reply` grounded in the note; the news item attaches to the
  rollout; the closed pen-test thread (Priya's "+1" FYI cc is its last message) and the invoice thread must not
  surface; the cadence must NOT be flagged as a drop; the stale task is a contradiction, never a to-do.

threads:
  - {id: t-northstar-connector-plan, subject: "SAP connector go-live - Apr 1 plan and owners",   category: customers}
  - {id: t-northstar-invoice,        subject: "Invoice TS-1187 - bill-to entity",               category: customers}
  - {id: t-northstar-pentest,        subject: "Pen-test summary for our vendor security file",  category: customers}
  - {id: t-northstar-training,       subject: "Scheduler training for the Fresno planners",     category: customers}
  - {id: t-northstar-golive,         subject: "April 1 - still on?",                            category: customers}
newsletters:
  - {id: nl-plantops-112, publication: "Plant Ops Digest", day: 29, time: "06:45", category: newsletters,
     sender: {name: "Plant Ops Digest", email: "weekly@plantopsdigest.com"},
     items: [{headline_hint: "Northstar Foods brings SAP-connected scheduling to Fresno", attaches_to: [rollout:northstar:apr-1]},
             {headline_hint: "FSMA 204 traceability compliance clock", attaches_to: []},
             {headline_hint: "Predictive maintenance ROI survey (140 plants)", attaches_to: []}]}

