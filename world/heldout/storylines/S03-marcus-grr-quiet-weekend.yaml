     event: "asks for the gross figure behind the 104% net retention shown for the FY25 cohort on the deck",
     must_include: ["104%"], hardness: []}
  - {ref: S3.h2, day: 23, time: "14:30", source: email, thread: t-marcus-grr, from: avery, to: [marcus],
     event: "answers: 96% gross for the FY25 cohort; the gap to net is one Coastline line that went idle in Q3, still a customer; workings are in the data room",
     must_include: ["96%"], hardness: [lowercase]}
  - {ref: S3.b1, day: 24, time: "16:48", source: email, thread: t-marcus-grr, from: marcus, to: [avery],
     event: "asks for gross revenue retention by cohort, split by segment (three reference accounts vs everyone else), FY24 and FY25 cohorts, as a table; adds that his model still carries the $3.2M ARR from the February deck and would rather hear from Avery if the retention view moves it; no deadline stated",
     must_include: ["gross revenue retention by cohort", "split by segment", "$3.2M"], hardness: [indirect_phrasing]}

