id: S3
name: marcus-grr-quiet-weekend
reviewed: true
tier_truth: P0
summary: >
  Held-out disguise of dev S3. A separate Marcus thread ("Retention numbers"). On Thursday day 23 Marcus asks for
  the gross figure behind the 104% net retention on the deck; Avery answers the same afternoon (96% gross, one idle
  Coastline line). On Friday day 24 at 16:48 Marcus asks for gross revenue retention by cohort, split by segment
  (the three reference accounts versus everyone else, FY24 and FY25 cohorts), and adds that his model still carries
  the $3.2M ARR from the February deck. The ball is with Avery and Avery never replies. test_s3 — quiet business
  days at 06:00 (weekday dates strictly after Fri 03-20 and strictly before the run date): Sun 03-22 (day 26) → 0
  [Sat 21 only]; Mon 03-23 (day 27) → 0 [Sat 21, Sun 22]; Tue 03-24 (day 28) → 1 [Mon 23]; Wed 03-25 (day 29) → 2
  [Mon 23, Tue 24]; Thu 03-26 (day 30) → 3 [Mon 23, Tue 24, Wed 25]. So the quiet-investor item is absent on days
  26–29 and present on day 30 only (P0 cases 1–3); calendar-day counting would surface it on Monday (3 calendar
  days): the trap. The reply draft must use $3.6M ARR from finance-review.md (day 21), not the profile's $3.2M, and
  flag the drift (P0 case 8). The day-23 exchange is history so the thread looks real; Avery's answer there is
  complete (no offer, no promise) so it cannot seed a commitment. Depends on OPEN_QUESTIONS #8.

threads:
  - {id: t-marcus-grr, subject: "Retention numbers", category: investors_board}

