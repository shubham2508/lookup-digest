  - {ref: S9.b3, day: 13, time: "09:15", source: email, thread: t-clara-loop,          from: jordan,  to: [avery],   cc: [tomas], event: "Clara passed the portfolio screen; onsite Wednesday the 18th; panel Priya, Hana, Jordan, Tomás; Avery does the 30-minute closer at 15:30", hardness: [long]}
  - {ref: S9.b4, day: 21, time: "08:45", source: email, thread: t-clara-loop,          from: jordan,  to: [avery],   cc: [tomas], event: "confirms Wednesday's schedule; Avery slot 15:30; scorecards in Ashby", hardness: [quoted_history]}
  - {ref: S9.n1, day: 22, time: "11:30", source: note, note: hiring-sync.md,
     event: "hiring sync: second backend req PAUSED until the A closes (Avery's call; Jordan to tell Northbeam); Clara Voss onsite today, debrief TBD (Jordan); Kenji offer approved; Maren Holt portfolio review next Thu",
     must_include: ["paused until the A closes", "debrief TBD"]}
  - {ref: S9.b5, day: 22, time: "18:05", source: email, thread: t-clara-loop,          from: jordan,  to: [avery],   cc: [tomas], event: "onsite done; four of five scorecards in Ashby; 'I'll get the debrief on the calendar once Tomás's scorecard is in' — never does", must_include: ["debrief"]}
  - {ref: S9.b6, day: 23, time: "14:40", source: email, thread: t-northbeam-shortlist, from: harriet, to: [avery],   cc: [jordan], event: "first shortlist: three candidates with one-line bios and links; asks who should run the first screen", must_include: ["three candidates"]}
