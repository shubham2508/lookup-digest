id: S9
name: hiring-paused-stall-northbeam
reviewed: true
tier_truth: P1
summary: >
  Three hiring signals that look alike and are not. (a) The second backend req is paused at the Wednesday day-22
  hiring sync ("paused until the A closes"; Jordan to tell Northbeam). Northbeam Talent, the retained firm Jordan
  engaged on day 2, keeps sending backend candidates on days 23, 27 (Yusuf Demir, the standout) and 29 because
  nobody told Harriet → not a stall, not a recruiter; dispatch is a one-line `forward_delegate` to Jordan ("req's
  paused, can you tell Harriet and hold the shortlist?"). (b) Product designer candidate Clara Voss finished her
  onsite on Wednesday day 22 (hiring-sync.md: "debrief TBD"); nobody schedules the debrief; 4 days unmoved at the
  day-26 run (no flag), 5 at day 27 (flag), 8 by day 30; she sends a polite nudge Tuesday day 28 08:50 →
  `hiring_stall`. (c) The profile says "two engineers and a designer"; the data says one backend req is at offer
  (Kenji, S8), the second is paused and only the designer is genuinely open → profile drift. Tests: paused → no stall
  flag (for the req or for Yusuf); Northbeam ≠ cold recruiter (retained, warm cc history, no recruiter_pattern line,
  no draft to Harriet or Yusuf); the real stall flagged on the boundary day; `profile_update` for the open reqs.

threads:
  - {id: t-northbeam-kickoff,   subject: "Northbeam x Tessera - backend search kickoff",  category: hiring}
  - {id: t-northbeam-shortlist, subject: "Senior Backend Engineer - first shortlist",     category: hiring}
  - {id: t-clara-loop,          subject: "Clara Voss - designer onsite Wed 3/18",         category: hiring}
  - {id: t-clara-nudge,         subject: "Checking in - designer role",                   category: hiring}

