summary: >
  Three personal-domain items from three kinds of sender, held-out disguise of dev S11. (1) Sam emails Monday day 27
  at 21:22: the district TK application needs both signatures by Friday, plus an unrelated question about Jun's
  birthday; Avery replies Tuesday 07:12 (done) so the item is present on day 28 only and gone after (resolved
  disappears). (2) Sunflower Cooperative Preschool (Marisol Vega) emails Wednesday day 29 at 15:40: early dismissal
  at 12:30 on Thursday March 26 for staff CPR recertification, no late room → collides with the 12:30 Tidewater intro
  (non-family sender, personal domain, high). (3) Sam adds "Wren - ENT follow-up" to shared_family.ics at 22:17 on
  day 29 for Thursday 11:15–12:00 (Lakeshore Pediatric ENT), overlapping the 11:00–11:45 Halberd QBR, and emails at
  22:25 (lowercase, multi-topic: Sam is in Sacramento all day Thursday so Avery has to take Wren; the 12:30 pickup;
  dry cleaning; Jun's photos). Lakeshore's automated booking confirmation (22:14) is personal automated FYI: a
  citation is fine, a second item is not. Tests: anything from Sam is P0 with no draft (P0 case 10); the ENT overlap
  surfaces with `message_person` and the created time (P0 case 11); the early dismissal collides with a meeting; a
  sibling's photo email is family but FYI (must not).

