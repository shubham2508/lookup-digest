id: S13
name: priya-gpu-commit
reviewed: false
tier_truth: P0
summary: >
  Held-out disguise of dev S13. Priya (co-founder, CTO) never emails Avery; on Tuesday day 28 at 20:41 she does,
  on purpose: the reserved-capacity commitment on the GPU pool at Kestrel Compute expires Mar 31 and Kestrel raises
  on-demand prices 18% on April 1. She lays out the numbers (one-year commit $153k/yr vs ~$222k/yr on demand at the
  new rate vs a smaller commit plus burst), recommends yes, and needs a yes/no by Friday because Kestrel wants the
  signed order by Monday 3/30. Avery does not reply. On Wednesday day 29 at 07:00 the Compute Ledger newsletter
  reports Kestrel's April 1 price increase. Tests: the profile's "if Priya emails instead of slacks, it's intentional"
  rule → P0 (P0 case 9); `decide` with options and a recommendation, not a fake approval; the news item attaches to
  the open item on day 30; Priya's "+1" cc reply on the closed GPU autoscaler thread (day 22) must not surface.

threads:
  - {id: t-priya-gpu,      subject: "gpu reserved commit - need a yes/no by friday", category: internal_routine}
  - {id: t-gpu-autoscaler, subject: "gpu pool autoscaler: drop min nodes to 4 off-hours?", category: internal_routine}
newsletters:
  - {id: nl-computeledger-41, publication: "Compute Ledger", from: {name: "Compute Ledger", email: "issue@computeledger.co"}, day: 29, time: "07:00", category: newsletters,
     items: [{headline_hint: "Kestrel Compute raises on-demand GPU pricing 18% on April 1; committed-use rates unchanged for existing terms", attaches_to: [other:gpu-commit-decision]},
             {headline_hint: "Marigold-2 open-weights release and benchmark table", attaches_to: []},
             {headline_hint: "800G optical transceiver lead times (the interconnect squeeze)", attaches_to: []}]}

beats:
  - {ref: S13.h1, day: 22, time: "10:05", source: email, thread: t-gpu-autoscaler, from: arjun, to: [jordan], cc: [priya, avery],
     event: "proposes dropping the GPU pool autoscaler minimum from 6 to 4 nodes outside business hours for Halberd backfill jobs; runbook link; asks Jordan for the OK", hardness: [technical_jargon]}
  - {ref: S13.h2, day: 22, time: "11:40", source: email, thread: t-gpu-autoscaler, from: jordan, to: [arjun], cc: [priya, avery],
     event: "approves with two conditions: queue-latency alert, revert if the morning backfill slips"}
  - {ref: S13.h3, day: 22, time: "11:52", source: email, thread: t-gpu-autoscaler, from: priya, to: [jordan], cc: [arjun, avery],
     event: "'+1. ship it.' keep the reserved 8 warm regardless; FYI-only cc reply on a closed thread (must-not: Priya FYI cc)", must_include: ["+1"]}
  - {ref: S13.n1, day: 21, time: "16:00", source: note, note: finance-review.md,
     event: "finance review (pinned in README): 'GPU reserved commit' ends 3/31, Priya to recommend", must_include: ["GPU reserved commit"]}
  - {ref: S13.b1, day: 28, time: "20:41", source: email, thread: t-priya-gpu, from: priya, to: [avery], cc: [],
     event: "reserved commit on the 8-GPU pool expires Mar 31; Kestrel raises on-demand 18% April 1; numbers: 1yr commit $153k/yr ($12.75k/mo) vs on-demand ~$18.5k/mo (~$222k/yr) vs 6-gpu commit + burst ~$170k/yr; 81% utilization, Northstar adds ~10% Apr 1; rec: yes, 1yr, 8 gpus; counter: cash during the raise; needs yes/no by friday, Kestrel wants the signed order by Monday 3/30; 'emailing so there's a paper trail'",
     must_include: ["$153k", "Mar 31", "April 1", "yes/no by friday", "paper trail"], hardness: [lowercase, terse]}
  - {ref: S13.b2, day: 29, time: "07:00", source: newsletter, newsletter: nl-computeledger-41, from: {name: "Compute Ledger", email: "issue@computeledger.co"},
     event: "Compute Ledger #41: Kestrel Compute raises on-demand GPU pricing 18% on April 1, committed-use rates unchanged for existing terms; two unrelated items",
     must_include: ["Kestrel Compute", "April 1", "18%"]}

