     event: "on-call last week: 6 pages, 2 overnight; the 4-person rotation is thin with Northstar ramping; asks Jordan about comp for primary or a 5th person", hardness: [terse]}
  - {ref: S15.b2, day: 15, time: "10:20", source: email, thread: t-oncall-rotation, from: jordan, to: [felix], cc: [avery, arjun],
     event: "adding on-call comp and rotation size to the infra review on the 17th; Arjun to pull page counts; 'Avery, nothing needed from you yet'", hardness: [quoted_history]}
  - {ref: S15.c1, day: 17, time: "14:40", source: calendar, event: infra-review-20260317, from: jordan,
     event: "invite for Tue day 21 09:30–10:30 (over the block); Avery declines on day 19 with 'deep-work block, send me the notes'"}
  - {ref: S15.n1, day: 21, time: "10:45", source: note, note: infra-review.md,
     event: "Infra review notes (Tue Mar 17), Avery declined: decision: on-call stipend $400/week per primary from Apr 1, needs Avery's sign-off; Nora: payroll cutoff for the Apr 1 run is Fri 3/27; alert re-tiering (Arjun); Q2 infra budget draft owed",
