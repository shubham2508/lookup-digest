id: S15
name: declined-infra-review
reviewed: false
tier_truth: P1
summary: >
  Jordan organized an "On-call & infra review" for Tuesday day 21 (Mar 17) 09:30–10:30, over Avery's deep-work
  block; Avery DECLINED on day 19 ("deep-work block, send me the notes"). Priya, Arjun, Felix and Nora attended. The
  review decided an on-call stipend of $400/week for whoever holds primary, starting Apr 1 (day 36); infra-review.md
  (day 21 10:45) records "needs Avery's sign-off". Nobody asks Avery until Jordan's recap email on Monday day 27 at
  13:05, which asks for sign-off by Friday 3/27 (day 31), Nora's payroll cutoff for the April 1 run. Origin thread:
  Felix's on-call gripe on day 15, answered by Jordan ("adding it to the infra review"), handled by the team. Tests:
  declined-meeting fallout (a decision made where Avery wasn't needs Avery); `decide`/`approve` with a
  recommendation; the DECLINED event over the block is not a deep-work violation; the origin thread must not surface.

threads:
