  - {ref: S15.b3, day: 27, time: "13:05", source: email, thread: t-oncall-stipend, from: jordan, to: [avery], cc: [nora, priya],
     event: "recap of the review Avery skipped: (1) stipend $400/week to whoever holds primary from Apr 1, ~$1,700/month all-in; Priya and Nora for it; Nora needs sign-off by Friday 3/27 for the payroll cutoff; invites a counter; (2) alert routing, no action; (3) Q2 infra budget draft coming, no action",
     must_include: ["sign-off", "by Friday", "$400/week"], hardness: [long, mixed_topics]}

