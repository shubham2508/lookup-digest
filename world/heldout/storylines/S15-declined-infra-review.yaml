     attendees: [{id: avery, partstat: DECLINED}, {id: jordan, partstat: ACCEPTED}, {id: priya, partstat: ACCEPTED}, {id: arjun, partstat: ACCEPTED}, {id: felix, partstat: ACCEPTED}, {id: nora, partstat: ACCEPTED}],
     created_day: 17, created_time: "14:40", last_modified_day: 19, note: "S15: over the deep-work block (Tue 09:00–11:00); Avery DECLINED on day 19"}

