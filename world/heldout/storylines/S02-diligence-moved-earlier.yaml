id: S2
name: diligence-moved-earlier
reviewed: false
tier_truth: P0
summary: >
  Held-out disguise of dev S2. work.ics holds "Tessera x IPV - technical diligence" on Tuesday day 35 (Mar 31)
  13:00–14:00, organizer Owen, Avery/Priya/Marcus/Owen accepted, created day 21 11:20. On Monday day 27 at 14:05
  Marcus emails to pull it forward to Friday Mar 27 (day 31) 11:00 because Julia Brandt, IPV's operating partner,
  wants to join and travels the week of the 30th. Avery confirms the same evening (18:20), welcomes Julia and asks
  Owen to update the hold; nobody does. On Wednesday day 29 at 06:04, four minutes after the run, Julia emails a
  prep request (an architecture diagram and the reference customers' contacts by Thursday EOD). Tests:
  calendar-vs-email contradiction shown with BOTH times (Tuesday 3/31 1pm vs Friday 3/27 11am) even though Avery
  had the last word in the thread; Julia inherits P0; the 06:04 email is absent on day 29 and present on day 30
  (P0 case 14). Timing differs from dev: the move email is on day 27, so the contradiction is visible from the
  day-28 run onward (28, 29, 30), not from day 29. Section for the contradiction mirrors dev (calendar_personal);
  variants.yaml's stale_inbox row lists it under urgent — flagged for the orchestrator to reconcile.

