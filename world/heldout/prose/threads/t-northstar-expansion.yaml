      Avery,

      We have not met; I lead supply chain for Northstar and Elise's team reports into my organization. The Fresno SAP connector work has been the most reliable systems project on my calendar this year, which is not something I say often, and once the April 1 Fresno go-live lands I would like to talk about what comes next. Specifically: rolling Tessera across Modesto and Fresno on one contract rather than plant by plant, with a shared exception view for my planners.

