      Avery,

      Good to see you and Tomás last week. Following up on the Fresno conversation so we have it in writing.

      We would like to target April 1 for the SAP connector go-live at Fresno. That gives our SAP team the March maintenance window for the interface tables and keeps us clear of quarter-end. Two questions before I take it to our ops council:

      - Who owns the go-live plan on your side? I want one name for our project office.
      - Are you able to join our weekly status call, or should that be Tomás and whoever runs the plan?

      Please say if April 1 is too tight. I would rather move it now than in three weeks.

      Elise
