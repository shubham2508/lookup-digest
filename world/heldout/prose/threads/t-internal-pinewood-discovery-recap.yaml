      - Scoping doc: yes to the 13th. Keep it to four pages. Turlock only; if they ask about the other three plants the answer is "after the pilot".
      - NDA: send Lucia our standard mutual NDA today. When their redline comes back I'll run it past Imogen at WSGR, don't negotiate it yourself, even the easy-looking bits.
      - References: hold. I'll ask Elise and Dmitri after their own QBRs, not during the busiest month either of them has had in a year.

