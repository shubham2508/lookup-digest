      Dear Jordan,

      Halberd is upgrading the Line 3 MES on Wednesday, March 25, in the evening (18:00–22:00 PT). Sanjay Kulkarni, our MES integration engineer, is copied and owns the change on our side.

      1. Please tell us what Tessera needs from us before the window (interface specification, station mapping, test events).
      2. Please confirm whether someone from Tessera will be available during the window should the integration require attention.
      3. Sanjay will send the updated interface specification by Tuesday.

      Thank you.
