    body: |
      Avery,

      The medical and dental renewal quote for the plan year starting July 1 came in from the benefits broker this morning:

      | Plan | Current monthly (company share) | Renewal | Change |
      |---|---|---|---|
      | Medical (PPO + HDHP) | $9,420 | $9,966 | +5.8% |
      | Dental | $1,180 | $1,204 | +2.0% |
      | Vision | $196 | $196 | 0% |

      That is under the 8% we budgeted, so nothing changes for the team and nothing changes in the model. Open enrollment would be the first two weeks of June.

      I'll bring two options to the May finance sync: keep the plans as they are, or add an HSA contribution to the HDHP so the higher-deductible option is a real choice for people. No action needed now; I just did not want the number to be a surprise later.
