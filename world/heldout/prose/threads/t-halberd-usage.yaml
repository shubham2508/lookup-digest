      Hi Tomás,

      Hope the week is treating you well! We survived our first real snow of the year at the Reno site, which mostly means everyone forgot how to drive.

      Could you send me the February usage report before our budget meeting on Thursday the 5th? Martin wants seat utilization by line, and I would like to walk in with your numbers rather than mine.

