      Hi Tomás,

      The budget meeting this morning went fine, thank you, the report did most of the talking. Two questions Martin asked that I couldnt answer on the spot:

      1. Does "seats active weekly" count a login, or actual scheduling activity? He suspects a few supervisors log in and do nothing.
      2. Is the Reno pilot billed at the same per-seat rate as the main plant, or at the pilot rate we discussed in the fall?

      No rush before Friday.

      Greta
  - id: m4
    beat_ref: S7.b8
    day: 9
    time: "16:40"
    from: tomas
    to: [greta]
    cc: [avery]
    reply_to: m3
    quotes_previous: true
    forward_of: null
    signature: default
    body: |
      Hi Greta,

      1. Activity, not logins. A seat counts as active if it created, moved or acknowledged at least one item in the week. A login with no action doesn't count, so Martin's suspicion, if true, isn't inflating the number.
      2. Reno is at the pilot rate ($140/seat/month) through the end of the pilot on May 1; after that it moves to the plant rate unless we fold it into the renewal, which I'd suggest.

      Tell Martin I'm happy to get on a call anytime!
