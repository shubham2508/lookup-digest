      A courtesy note as we enter the final year of your term. Tessera's lease for Suite 420 at 1475 Webster St runs through December 31, 2026. The renewal option in Section 3.4 requires written notice no later than June 30, 2026 if you intend to exercise it at the pre-set rate (3% over current); after that date we would go to market for the space.

