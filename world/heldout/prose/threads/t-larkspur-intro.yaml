    body: |
      Avery, Farah — connecting you as promised.

      Farah, Avery Chen is the co-founder and CEO of Tessera, the company I described this afternoon: plant-floor forecasting for mid-size manufacturers, three reference customers live, raising a Series A this spring. I have been on the board since the seed.

      Avery, Farah Siddiqui is a General Partner at Larkspur Partners. Larkspur has spent the last year building a thesis around software for industrial operators, and Farah asked me which company in our portfolio to talk to first. Tessera was the obvious answer.

      I'll leave you two to find a time. No need to keep me on the thread.

      Diane
