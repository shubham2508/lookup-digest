      Hi Avery,

      Some news from my side: I'm moving to a plant operations role at our Reno site at the end of this week. It has been a genuine pleasure working with you and Tomás, and I'm a little sad to hand this over.

      Tobias Weller is taking over from me as procurement lead from Tuesday. He is new to Halberd (joined in January from a tier-1 automotive supplier) and very thorough, so expect requests for documents by name. I've briefed him on the renewal, on Martin's timing, and on the Line 3 MES work; he'll introduce himself directly.

      Thank you for everything. I'll still be at Halberd, just with more hi-vis.

      Greta
