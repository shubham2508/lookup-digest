    body: |
      Hello Hana,

      To be precise about the request:

      - Our lot records (e.g. lot 26008-A, lot 26011-C) must show the governing specification and revision, currently VC-QS-114 rev D, section 7.5.
      - Today the export from your system carries lot number, quantity, work center and timestamps, but not the spec reference.
      - The auditor is on site March 16–17 and will sample five lots.

      Is there a way to carry a spec-reference field on the lot record and include it in the CSV export? If it requires a configuration change, please tell me the lead time.

      Regards,
  - id: m3
    beat_ref: S6.b3
    day: 2
    time: "16:30"
    from: hana
    to: [anika]
    cc: [avery, dmitri]
    reply_to: m2
    quotes_previous: true
    forward_of: null
    signature: default
    body: |
      Hi Anika,

      Yes. A custom field on the lot record does this, and it flows into the CSV export automatically.

      - [ ] I add a text field "Spec reference" to your lot record today
      - [ ] You set the default value to VC-QS-114 rev D §7.5 (Settings → Lot records → Fields); per-lot overrides are allowed
      - [ ] The export picks it up as the last column from the next run

      No lead time beyond today. I will send a screenshot once the field is live, by **Tuesday, March 3, 10:00 PT**, so you have two weeks before the auditors arrive on **March 16**.

      Hana
