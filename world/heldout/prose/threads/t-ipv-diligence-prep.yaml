      Avery,

      Marcus tells me Friday 11am is set, and I'm glad to be joining. I've read the deck and the data-room memo, and I've been through the two customer call write-ups Owen did in February, so Friday can be a working session rather than a tour. Two things I'd like in hand by Thursday EOD:

