      Avery, Jordan,

      Per our agreement, here is the first shortlist for the Senior Backend Engineer search: three candidates, all pre-screened by me this week and all aware of Tessera by name.

      1. Devika Raman - 7 yrs, staff-adjacent backend at a freight-visibility startup; owns their Kafka-to-Postgres pipeline. Open to hybrid Oakland. northbeamtalent.com/c/draman
      2. Tom Aldridge - 9 yrs, ex-industrial IoT (vibration sensors), Go and Rust, remote in Denver. Strong on time-series compaction. northbeamtalent.com/c/taldridge
      3. Wei Zhang - 5 yrs, Python, built the ingestion layer for a mid-size MES vendor; wants a smaller team. San Francisco. northbeamtalent.com/c/wzhang

      Who should run the first screen on your side - Jordan directly, or would you like me to hold them for a week? All three can do a 30-minute call next week.

