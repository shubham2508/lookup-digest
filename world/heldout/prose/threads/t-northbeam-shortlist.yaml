      Two more names to add to the shortlist, and one of them I'd move on quickly:

      4. Yusuf Demir - 8 yrs, backend lead at a Berlin logistics-software company, relocating to the Bay Area in May on a spouse visa, so no sponsorship needed. Python and Go; built a streaming ingest for 40k telematics devices. Reading his GitHub was the best hour of my week: northbeamtalent.com/c/ydemir. He is the standout of the search so far.
      5. Renata Quon - 6 yrs, Python, currently at a cold-chain monitoring company; remote in Portland. northbeamtalent.com/c/rquon

      And per our agreement, I'd like your read on the first three before I go further. Even a one-word yes/no per person keeps the seach pointed the right way. I haven't heard from Jordan on screening slots yet; happy to hold everyone another week if the timing is off, just say so.

