      Arjun,

      Impact: saves ~$9.6k/month, adds 6-8 minutes of scale-up latency off-hours on a queue that can absorb it. Fine by me, with two conditions:

      - Add a queue-latency alert (p95 over 20 min) to the on-call channel before you flip it, not after.
      - If the 06:00 backfill completion slips past 07:30 on any morning next week, revert first and we talk after.

      Ship it tonight. Put the before/after in Thursday's standup notes.
