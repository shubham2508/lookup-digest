      Hi Imogen,

      Case TS-5490 (Coastline DPA). Sub-processor list for Annex 2, confirmed against our current vendor inventory:

      - Google Cloud Platform (hosting, us-west1)
      - Sentry (error monitoring; no customer production data, but it can see tenant IDs)
      - Postmark (transactional email; recipient names and addresses only)

      One question: Coastline's purchasing team asked on our last call whether they can add their ERP vendor as an "authorized recipient" of the nightly export. Does that belong in the DPA, or is it just an instruction from the customer that we document in the ticket?
