      Avery,

      Attached is the first draft of the disclosure schedules to the Series A Stock Purchase Agreement (Tessera_SeriesA_DisclosureSchedules_Draft1_2026-03-23.docx). Four points:

      1. Schedules 3.5 (Capitalization) and 3.9 (Material Contracts) are complete on our side. The Halberd, Northstar and Veritas agreements are listed by title and date; please confirm there are no amendments we have not seen.
      2. Schedule 3.12 (Financial Statements; Projections) is the one that needs you. IPV's counsel has asked that the 24-month projections referenced in the term sheet be summarized there. I have bracketed the revenue, headcount and cash figures pending the revised operating model. Once that model is final, Imogen will drop the numbers in.
      3. Schedule 3.14 (Intellectual Property) reflects the assignment agreements from the January clean-up. Nothing further needed.
      4. Imogen will keep a running list of open items and circulate it with each turn.

      Please send me any changes before this goes to IPV's counsel; we would like a clean draft out by the end of the week. If I hear nothing I will treat the schedules other than 3.12 as agreed.

      Ben
