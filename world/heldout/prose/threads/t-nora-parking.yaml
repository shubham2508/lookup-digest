      Hi all,

      The building switched parking vendors on March 1 and the new hangtags for our lot arrived today. Nothing to do except pick yours up.

      | Permit | Assigned to | Where |
      |---|---|---|
      | T-101 to T-108 | one per named driver (list on the envelope) | front desk, ask Dolores |
