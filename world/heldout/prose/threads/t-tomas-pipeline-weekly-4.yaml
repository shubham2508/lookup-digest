      Happy Monday!!

      Go-live week minus one. Rundown below. As always this is an FYI, there is nothing in here that needs a decision or a reply from anyone, I just want us all looking at the same board.

      NORTHSTAR - nine days to April 1. Hana says the connector is on track and the cutover runbook is going to Elise and Rosa this week. The Fresno planners get their scheduler training tomorrow morning (Hana, 9am). I have stopped waiting for the other shoe. There is no shoe. There has never been a shoe.

      PINEWOOD - the scoping doc is with Lucia. Six-week pilot, Turlock first, kickoff pencilled for Friday April 3 at 10 (tentative hold on your calendar, ignore it until it firms up). Leo and Hana are running it. Two references requested; I'll ask after the Northstar go-live and the Veritas QBR, not before.

      IRONCLAD - Gordon agreed to a site visit in April. Leo is picking dates with him this week. Still no number in the sheet until we've walked the floor. Leo has bought steel-toe boots for the occasion and I have never been prouder.

      HALBERD - QBR Thursday 11:00 with Tobias, his first as procurement lead. Hana's deck is nearly done and I've got the agenda. Sanjay's team is doing the Line 3 MES upgrade Wednesday evening with Arjun on our side, so Thursday's deck will have a "what happened last night" slide one way or the other. Fun!!

      VERITAS - QBR Wed Apr 8 still tentative pending Hugo's calendar; agenda drafted. The Line 4 seat invoice is finally through their AP as of Friday. Renewal June.

      COASTLINE - green, nothing new, the best kind of customer paragraph.

      Numbers: 13 open opportunities, $1.5M weighted, 2 pilots scoping + Pinewood pending. Q1 closes Tuesday and I'm doing the quarter recap for next Monday's leadership sync as a one-pager, not a deck, you're welcome.

      Events: roundtable May 7 (save-the-dates go out the week after go-live), the Central Valley Food Processing Expo is May 19-20 in Fresno and I want a table, and the podcast people have emailed me for the fourth time so I'm going to say yes just to make it stop.

      GTM weekly at 3 today. Leo, Hana, see you there.

      Have a great week!!

      Tomás
