    body: |
      Harriet,

      Following up on Tuesday's call: we'd like to engage Northbeam on a retained basis for the second backend engineer role. Avery is cc'd and will do the final conversation with whoever we take to offer.

      Scope, so we're aligned before the engagement letter:
      - Role: Senior Backend Engineer, our second backend hire this half. The first is already in process through our own pipeline.
      - Must-haves: production Python or Go, streaming or time-series data, comfortable being on call. Manufacturing or logistics exposure is a plus, not a requirement.
      - Comp band: $170k-$200k base plus equity at the level; we'll share the grant table under NDA.
      - Location: Bay Area hybrid (two days in Oakland) or remote in US Pacific/Mountain time.
      - Process: you screen, I do the technical screen, a four-hour onsite, then Avery.

      Please send the engagement letter to me and Nora (cc'd) for signature. Shortlist timing: whatever is realistic, but I'd love first names inside three weeks.

