  - id: nl-scmorning-wknd-12
    day: 12
    time: "07:40"
    from: {name: "Supply Chain Morning", email: "morning@scmorning.co"}
    to: [avery]
    subject: "Sunday: the week ahead in supply chain (Mar 9-13), and yes, the clocks moved"
    bulk: true
